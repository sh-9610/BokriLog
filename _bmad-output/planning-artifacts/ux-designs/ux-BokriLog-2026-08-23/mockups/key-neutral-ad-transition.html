<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BokriLog 광고 전환 목업</title>
  <style>
    /* Governed by DESIGN.md: Colors, Typography, Elevation & Depth,
       Components/neutral-ad-transition. EXPERIENCE.md: Information Architecture/중립 광고 전환,
       Voice and Tone, Component Patterns/neutral-ad-transition,
       State Patterns/광고 동의·제3자 데이터 계약, Interaction Primitives,
       Accessibility Floor, Key Flows/UJ-1 step 5 and Failure. */
    :root{--base:#F7F8F6;--raised:#FFF;--subtle:#EEF1EE;--ink:#17211B;--ink2:#47564D;--muted:#64726A;--strong:#87958C;--primary:#245C48;--focus:#1D4F91;--r-md:10px;--r-lg:14px}
    *{box-sizing:border-box}body{margin:0;background:#E4E8E4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.canvas{min-height:100vh;display:grid;place-items:center;padding:32px 16px}.phone{width:min(390px,100%);min-height:780px;background:var(--base);border:1px solid #AEB8B1;border-radius:28px;box-shadow:0 18px 50px rgba(23,33,27,.16);overflow:hidden;display:flex;flex-direction:column}.statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:650}.top{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;letter-spacing:-.02em}.close{min-height:44px;padding:0 14px;border:1px solid var(--strong);background:var(--raised);color:var(--ink);border-radius:var(--r-md);font-weight:700}.content{flex:1;display:flex;flex-direction:column;padding:18px 20px 30px}.heading{margin:2px 0 4px;font-size:20px;line-height:1.4}.sub{margin:0 0 18px;color:var(--ink2);font-size:14px}.adlabel{align-self:flex-start;margin-bottom:7px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.05em}.adbox{min-height:410px;border:1px solid var(--strong);border-radius:var(--r-lg);background:var(--raised);display:grid;place-items:center;padding:24px;text-align:center}.placeholder{max-width:240px}.admark{width:52px;height:52px;margin:0 auto 14px;border:1px dashed var(--strong);border-radius:var(--r-md);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}.placeholder strong{display:block;font-size:17px;margin-bottom:5px}.placeholder p{margin:0;color:var(--muted);font-size:13px}.privacy{margin:16px 0 0;padding:14px;background:var(--subtle);border-radius:var(--r-md);color:var(--ink2);font-size:13px}.privacy strong{display:block;color:var(--ink);margin-bottom:3px}.route{margin-top:auto;padding-top:18px;text-align:center;font-size:13px;color:var(--muted)}.route a{color:var(--primary);font-weight:700;text-underline-offset:3px}
    @media(max-width:420px){.canvas{padding:0}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="canvas">
    <section class="phone" aria-label="BokriLog 중립 광고 전환 화면">
      <div class="statusbar"><span>7:45</span><span aria-hidden="true">● ● ▰</span></div>
      <header class="top"><div class="brand">BokriLog</div><button class="close" type="button">광고 닫기</button></header>
      <div class="content">
        <h1 class="heading">결과를 준비했습니다</h1>
        <p class="sub">광고를 건너뛰어도 최신 결과를 확인할 수 있습니다.</p>
        <div class="adlabel">광고</div>
        <section class="adbox" aria-label="외부 광고 영역">
          <div class="placeholder"><div class="admark">AD</div><strong>외부 광고 소재 영역</strong><p>실제 공급자의 승인된 문맥형 광고가 이 영역에 표시됩니다.</p></div>
        </section>
        <div class="privacy"><strong>비개인화 문맥형 광고</strong>금융 정보나 계획 데이터는 광고 맞춤화에 사용하지 않습니다.</div>
        <div class="route">광고가 열리지 않거나 동작하지 않으면 <a href="#">결과로 이동</a>합니다.</div>
      </div>
    </section>
  </main>
</body>
</html>
