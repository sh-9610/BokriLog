<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="BokriLog는 읽기 전용으로 연결한 Bybit UTA 계좌를 기준으로 복리 계획과 기록을 비교합니다. 거래 실행과 투자 추천을 제공하지 않습니다."
    />
    <!--
      파비콘은 인라인 data: URI다. 외부 파일이면 브라우저가 매 로드마다 /favicon.ico를 요청해
      동일 출처 404가 남고 "문서·번들 외 요청 0건" 주장과 실제 네트워크 탭이 어긋난다.
      색은 tokens.css의 --color-surface-raised / --color-primary와 같은 값이다.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFFFFF'/%3E%3Crect x='5' y='19' width='5' height='8' rx='1.5' fill='%23245C48'/%3E%3Crect x='13.5' y='13' width='5' height='14' rx='1.5' fill='%23245C48'/%3E%3Crect x='22' y='5' width='5' height='22' rx='1.5' fill='%23245C48'/%3E%3C/svg%3E"
    />
    <title>복리 계획 비교 · BokriLog</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!--
        JavaScript가 꺼져도 이 화면의 목적인 "가입 전 고지"는 전달되어야 한다.
        카피 전체를 복제하지 않고 이용 범위·비추천 고지·인증 경계 세 가지만 담는다.
      -->
      <div
        style="
          max-width: 60ch;
          margin: var(--space-5, 24px) auto;
          padding: 0 var(--space-page-mobile, 16px);
          font-family: var(
            --type-body-font-family,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif
          );
          line-height: var(--type-body-line-height, 1.6);
          color: var(--color-ink-primary, #17211b);
        "
      >
        <h1
          style="
            font-size: var(--type-page-title-font-size, 28px);
            line-height: var(--type-page-title-line-height, 1.3);
          "
        >
          복리 계획 비교
        </h1>
        <p><strong>투자성과·계좌 수익률·투자 추천이 아닙니다.</strong></p>
        <p>
          BokriLog는 읽기 전용 Bybit UTA 연결을 기준으로 복리 계획과 기록을 비교하는 서비스입니다.
          거래 실행·투자 추천을 제공하지 않습니다.
        </p>
        <p>
          Google·네이버·카카오는 본인 확인에만 사용하며 Bybit 자격정보·금융 데이터·계획은 공유하지
          않습니다.
        </p>
        <p>전체 안내를 보려면 브라우저에서 JavaScript를 허용해 주세요.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
