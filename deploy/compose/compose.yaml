# BokriLog 동일 출처 셸 — 개발·CI 공용 구성.
#
# 이 파일은 production 프로필이 아니다. 운영 구성은 `deploy/production/compose.yaml` 한 벌이 따로 소유한다(Story 3.8) —
# image digest 고정, 자원 제한(`mem_limit`), blue/green 슬롯(`api-blue`·`api-green`), API·Worker 역할 분리
# (`BOKRILOG_ROLE=api|worker`), 단일 Worker drain이 그쪽에 있다. 로그 전송(Alloy)과 컨테이너 권한 강화(`user`·`read_only`·
# `cap_drop`)는 후속 작업이 소유한다(`deferred-work.md`). 여기서 하는 일은 하나다.
# "빌드된 프런트엔드 산출물과 백엔드 jar를 하나의 origin 뒤에 세워 실제 배포 형태를 재현한다."
#
# 이 스택의 백엔드는 역할 `all`(기본값) 하나다 — API와 Worker가 한 프로세스이고 drain·단일 Worker 잠금이 없다. 역할을 나눈
# 모양은 운영 구성과 그 리허설(`deploy/production/rehearse-deploy.sh`)이 검증한다. Nginx 본문(`bokrilog.conf`)은 운영과 같고
# upstream 블록 하나만 이 스택의 `deploy/nginx/upstream-backend.conf`(`backend:8080`)를 마운트한다.
#
# 그래서 서비스마다 권한 모양이 다르다. 백엔드는 자기 이미지가 비-root 사용자를 만들어 쓰지만
# nginx·postgres 서비스에는 `user`·`read_only`·`cap_drop`·자원 제한이 없다. 두 공식 이미지의
# entrypoint가 root로 시작해 권한을 내리는 구조를 이 프로필에서 되짚을 이유가 없기 때문이며,
# 개발·CI 전용 스택이라 감수하는 선택이다. 실수로 빠진 것이 아니라 위 목록이 소유한다는 뜻이다.
#
# 실행 전제: `frontend/dist`와 `backend/build/libs/bokrilog-backend.jar`가 이미 존재한다.
# 이 구성은 어느 쪽도 빌드하지 않는다. CI가 두 품질 job의 산출물을 재빌드 없이 소비하는 것과
# 로컬 실행을 같은 모양으로 맞춘다(CI-PLAN §8).
#
# 서비스는 넷이고 기본 `up`에 뜨는 것은 셋이다. `postgres` → `backend` → `nginx`가 healthcheck로
# 이어져 있고, `migrate`는 `profiles`에 가려 있다가 `verify-same-origin.sh`가 `up` 앞에서 한 번만
# 실행한다(AD-12). 스키마를 바꾸는 것은 그 실행 하나뿐이며 API 기동은 검증만 한다.
#
# 명령은 `deploy/compose/verify-same-origin.sh`가 소유한다. 직접 다룰 때는
# `docker compose --file deploy/compose/compose.yaml ...`로 저장소 루트에서 실행한다.

name: bokrilog

services:
  postgres:
    # `ARCHITECTURE-SPINE.md` Stack 표의 PostgreSQL 18.x다. 백엔드 시험의
    # `PostgresTestcontainersConfig`도 같은 태그를 쓴다. 두 곳이 갈라지면 시험이 통과한 엔진과
    # 스택이 띄우는 엔진이 달라진다.
    image: postgres:18.6-alpine
    # 백엔드와 같은 이유로 포트를 게시하지 않는다. 호스트에서 데이터베이스에 직접 닿는 경로를
    # 만들면 "바깥에 열리는 포트는 Nginx 하나"라는 이 구성의 계약이 깨진다.
    expose:
      - '5432'
    environment:
      # 자격정보가 아니다. 비밀번호가 없기 때문이다.
      #
      # 개발·CI 전용 스택이고 포트를 게시하지 않으므로 이 데이터베이스에 닿을 수 있는 것은 같은
      # compose 네트워크 안의 서비스뿐이다. 여기에 가짜 비밀번호를 넣으면 그 리터럴 때문에
      # gitleaks 규칙을 완화하고 싶어지고, 그 완화는 남는다. production 자격정보는 Story 3.8이
      # 소유한다.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: bokrilog
      POSTGRES_USER: bokrilog
    healthcheck:
      # 이 healthcheck는 선택이 아니다. `backend`와 `migrate`가 모두 `service_healthy`를
      # 기다리므로, 없으면 두 곳이 "언제 준비됐는가"를 알 수 없어 대기가 끝나지 않는다.
      #
      # `pg_isready` 하나로는 부족하다. postgres 이미지는 초기화 중 로컬 전용 임시 서버를 한 번
      # 띄웠다 내리는데 그 창에서도 `pg_isready`가 통과한다. 실제 질의를 한 번 던져야 "지금
      # 연결해 작업할 수 있다"가 된다.
      test:
        - CMD-SHELL
        - pg_isready --username=bokrilog --dbname=bokrilog --quiet && psql --username=bokrilog --dbname=bokrilog --no-password --quiet --command='SELECT 1' >/dev/null
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: 'no'

  # 일회성 schema migration 역할(AD-12).
  #
  # `profiles`가 붙어 있어 기본 `up`에 들어오지 않는다. 정상 종료하는 일회성 서비스를 compose의
  # `--wait`가 잘 다루지 못하기도 하고, "스키마 변경은 API 기동과 분리된 별도 단일 실행"이라는
  # AD-12의 모양과도 맞지 않기 때문이다. `verify-same-origin.sh`가 `up` 앞에서 한 번 실행한다.
  #
  # 백엔드와 같은 이미지를 쓴다. 스키마를 바꾸는 코드가 API가 실행하는 코드와 다르면, 검증이
  # 통과한 스키마와 기동이 기대하는 스키마가 갈라질 자리가 생긴다. 차이는
  # `SPRING_PROFILES_ACTIVE` 하나뿐이고, 그 프로필에서만 Flyway가 실제로 마이그레이션한다
  # (`SchemaValidationConfig`).
  migrate:
    profiles:
      - migrate
    build:
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 이 프로필은 웹 서버를 띄우지 않는다. 마이그레이션이 끝나면 프로세스가 그대로 종료하고
      # 그 종료 코드가 곧 마이그레이션의 성공 여부다.
      SPRING_PROFILES_ACTIVE: migrate
      BOKRILOG_DB_URL: jdbc:postgresql://postgres:5432/bokrilog
      BOKRILOG_DB_USERNAME: bokrilog
    restart: 'no'

  backend:
    build:
      # 컨텍스트는 `backend/`다. `.dockerignore`가 미리 빌드한 jar 하나만 남긴다.
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        # 기본 프로필의 기동은 Flyway schema 검증을 포함한다(AD-12). 데이터베이스가 아직 받을
        # 준비가 되지 않았으면 그 검증이 연결 실패로 끝나고 컨테이너가 그대로 죽는다.
        condition: service_healthy
    # 포트를 게시하지 않는다. 바깥에서 백엔드에 직접 닿는 경로를 만들면 그 순간
    # "동일 출처"는 구성이 아니라 관례가 된다.
    expose:
      - '8080'
    environment:
      # 자격정보가 아니다. 컨테이너 안 포트를 Dockerfile·nginx 설정과 한 값으로 묶는다.
      SERVER_PORT: '8080'
      # 연결 정보는 환경이 준다(`application.yml`이 두 이름만 정하고 값은 적지 않는다).
      # 비밀번호 항목이 없는 것은 누락이 아니라 위 `POSTGRES_HOST_AUTH_METHOD: trust`와 한 쌍이다.
      BOKRILOG_DB_URL: jdbc:postgresql://postgres:5432/bokrilog
      BOKRILOG_DB_USERNAME: bokrilog
      # 개발용 OIDC 스텁 프로필(Story 1.4).
      #
      # 이 프로필에서만 `/api/dev-oidc/**`에 local OIDC 제공자가 존재하고 제공자 등록이 그
      # 스텁을 가리킨다(`DevOidcStubConfig`). 그래서 이 스택은 자격정보 없이도 인가 시작 →
      # 동의 → 콜백 → 세션까지의 성공 왕복이 완성되며, 브라우저 층이 그 경로를 실제로 지난다.
      # Authorization Code 흐름의 인가 요청은 브라우저가, code 교환은 백엔드가 보내므로 스텁을
      # 브라우저 안에서 흉내낼 수는 없다.
      #
      # `:-`가 아니라 `-`다. 실제 Google 자격정보를 쓰려는 실행은 이 변수를 빈 값으로 두어
      # 기본 프로필로 뜬다. 스텁과 실제 제공자가 함께 구성되면 백엔드가 기동을 거부한다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-dev-oidc,dev-bybit}
      # 브라우저가 보는 origin이다. redirect URI와 스텁의 인가 주소를 여기서 조립한다.
      # 요청 Host에서 유도하지 않으므로 nginx가 포트를 잃는 것과 무관하다.
      BOKRILOG_PUBLIC_BASE_URL: ${BOKRILOG_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      # 백엔드가 자기 스텁에 닿는 주소. 위 공개 origin은 compose 네트워크 안에서 해석되지
      # 않으므로 code 교환과 JWKS 조회는 이 주소로 나간다. 위 `SERVER_PORT`와 한 쌍이다.
      BOKRILOG_DEV_OIDC_INTERNAL_BASE_URL: ${BOKRILOG_DEV_OIDC_INTERNAL_BASE_URL:-http://127.0.0.1:8080}
      # 실제 제공자 등록. 이름만 여기 있고 값은 이 파일에 없다. 위 스텁 프로필과 함께 값이
      # 주어지면 백엔드가 기동을 거부하며, 비면 그 제공자의 등록이 만들어지지 않아 인증 시작이
      # 공통 오류 계약으로 fail-closed다(`AuthSecurityConfig`). 판정은 제공자 단위로 독립하므로
      # 한 제공자만 구성해도 그 제공자로 로그인할 수 있다.
      #
      # 가짜 값을 채우지 않는다. client secret 모양의 리터럴을 커밋하면 gitleaks 규칙을
      # 완화하고 싶어지고 그 완화가 남는다. production 자격정보는 Story 3.8이 소유한다.
      BOKRILOG_GOOGLE_CLIENT_ID: ${BOKRILOG_GOOGLE_CLIENT_ID:-}
      BOKRILOG_GOOGLE_CLIENT_SECRET: ${BOKRILOG_GOOGLE_CLIENT_SECRET:-}
      BOKRILOG_NAVER_CLIENT_ID: ${BOKRILOG_NAVER_CLIENT_ID:-}
      BOKRILOG_NAVER_CLIENT_SECRET: ${BOKRILOG_NAVER_CLIENT_SECRET:-}
      BOKRILOG_KAKAO_CLIENT_ID: ${BOKRILOG_KAKAO_CLIENT_ID:-}
      BOKRILOG_KAKAO_CLIENT_SECRET: ${BOKRILOG_KAKAO_CLIENT_SECRET:-}
      # 개발용 Bybit 스텁(Story 2.1).
      #
      # 위 `dev-bybit` 프로필에서만 `/api/dev-bybit/**`에 local Bybit이 존재하고 어댑터가 그
      # 주소를 가리킨다(`DevBybitStubConfig`). 그래서 이 스택은 실제 거래소 계정 없이도
      # "폼 제출 → 세 검증 → 저장 → 세션 회전" 왕복이 완성되며, 검증 스크립트가 그 경로를 실제로
      # 지난다. 제공자 API 호출은 백엔드가 서버 대 서버로 보내므로 브라우저 안에서 흉내낼 수 없다.
      #
      # 주소가 위 `SERVER_PORT`와 한 쌍이다. 프로필이 켜졌는데 이 값이 스텁을 가리키지 않으면
      # 백엔드가 기동을 거부한다 — 스텁과 실제 제공자가 한 프로세스에 섞이지 않는다.
      # `:-`가 아니라 `-`다. 위 `SPRING_PROFILES_ACTIVE`와 같은 관용이며 이유도 같다 — 실제
      # 제공자를 쓰려는 실행은 이 변수를 **빈 값**으로 두어 스텁 프로필과 함께 벗어난다. `:-`로
      # 두면 빈 값에도 스텁 경로가 남고, 그 스택에는 그 라우트가 없어 404가 인증 거절로 접힌다.
      # 프로필이 꺼졌는데 이 값이 스텁을 가리키면 백엔드가 기동을 거부한다
      # (`BybitProviderTargetGuard`).
      BOKRILOG_BYBIT_BASE_URL: ${BOKRILOG_BYBIT_BASE_URL-http://127.0.0.1:8080/api/dev-bybit}
      # 운영 reserved IP. 키의 `ips` 허용 목록에 이 값이 있어야 연결이 통과한다(AR-21).
      #
      # 문서용 주소(RFC 5737 TEST-NET-3)다. 자격정보가 아니며, 이 스택에서 실제로 나가는 IP와
      # 다른 값인 것이 의도다 — IP binding이 "호출자의 주소"가 아니라 "키에 등록된 주소"를 본다는
      # 계약이 그래야 검증된다.
      BOKRILOG_BYBIT_RESERVED_IP: ${BOKRILOG_BYBIT_RESERVED_IP-203.0.113.10}
      # 자격정보 암호화 key ring. 이름만 여기 있고 **값은 이 파일에 없다.**
      #
      # 32바이트 키의 base64는 자격정보 모양 리터럴이다. 가짜 값이어도 커밋하지 않는다 —
      # gitleaks 규칙을 완화하고 싶어지고 그 완화가 남는다(위 client secret과 같은 근거).
      # 개발·CI의 키는 `verify-same-origin.sh`가 실행 시점에 만들어 이 두 변수로 넣고, 값이 없으면
      # 연결 기능만 공통 오류 계약으로 fail-closed다. production 비밀 공급은 Story 3.8이 소유한다.
      BOKRILOG_SOURCE_CREDENTIAL_KEYS: ${BOKRILOG_SOURCE_CREDENTIAL_KEYS:-}
      BOKRILOG_SOURCE_CREDENTIAL_ACTIVE_KEY_VERSION: ${BOKRILOG_SOURCE_CREDENTIAL_ACTIVE_KEY_VERSION:-}
      # 운영자 allowlist(Story 3.1). **기본값은 비어 있다(운영자 없음, fail-closed).** dev-oidc 스텁은 subject를
      # 고를 수 있으므로 기본값에 운영자를 두면 이 스택에 닿는 누구나 운영자가 된다. 운영자가 필요한 실행
      # (`verify-same-origin.sh`와 그 뒤의 Playwright 회귀)이 명시적으로 넣는다.
      BOKRILOG_OPERATORS: ${BOKRILOG_OPERATORS:-}
      # 감사 digest 키. 이름만 여기 있고 **값은 이 파일에 없다**(위 key ring과 같은 근거). 비면 백엔드가 기동을
      # 거부한다 — `verify-same-origin.sh`가 실행 시점에 만들고, 손으로 띄울 때는 `DEVELOPMENT.md`의 명령으로 넣는다.
      BOKRILOG_AUDIT_DIGEST_KEY: ${BOKRILOG_AUDIT_DIGEST_KEY:-}
      # 계정 삭제 tombstone digest 키(Story 5.3, Epic 5 회고 AI-3). 이름만 여기 있고 **값은 이 파일에 없다**(위 key ring과 같은
      # 근거). **감사 digest 키와 다른 값이어야 한다** — 같으면 백엔드가 기동을 거부한다. 이 스택의 백엔드는 역할 `all`이라 Worker를
      # 겸하고, 그 Worker는 이 값이 있어야 사용자 계정 삭제 실행을 집는다 — 비어도 기동은 되지만 삭제 요청이 영원히 진행 중으로 남는다.
      # `verify-same-origin.sh`가 감사 키와 따로 실행 시점에 만들고, 손으로 띄울 때는 `DEVELOPMENT.md`의 명령으로 넣는다.
      BOKRILOG_TOMBSTONE_DIGEST_KEY: ${BOKRILOG_TOMBSTONE_DIGEST_KEY:-}
      # 서비스 공지(Story 3.5)의 지원 연락처. **기본값은 비어 있다** — 비면 공지 발행이 거절되고 사용자 공지에 연락처가
      # 없다(허위 지원 경로를 만들지 않는다). 개발·CI의 값은 `verify-same-origin.sh`가 개발용 주소로 넣고 그 스택에
      # 이어 도는 Playwright 회귀가 그 값을 쓴다.
      BOKRILOG_SUPPORT_CONTACT: ${BOKRILOG_SUPPORT_CONTACT:-}
      # 메트릭 공통 tag `env`(Story 3.7). 이 스택은 개발(`development`) 또는 CI(`ci`)다 — `production`을 쓰지 않는다.
      # CI의 `동일 출처 검증` 단계가 `ci`를 넣는다. 관리 포트(기본 18081)는 컨테이너의 127.0.0.1에만 묶인다
      # (`BOKRILOG_MANAGEMENT_ADDRESS` 기본값). 게시도 `expose`도 하지 않으므로 같은 compose 네트워크의 다른 서비스도 닿지 못하고,
      # 같은 컨테이너 안에서만 읽힌다(`verify-same-origin.sh`가 그렇게 읽는다).
      BOKRILOG_ENV: ${BOKRILOG_ENV:-development}
    healthcheck:
      # alpine 베이스의 busybox wget이다. 이미지에 도구를 더 넣지 않는다.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/api/status']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # `application.yml`의 `spring.lifecycle.timeout-per-shutdown-phase`(5초)보다 길어야 한다.
    # 짧으면 graceful shutdown이 끝나기 전에 SIGKILL이 도착해 `server.shutdown: graceful`이
    # 설정으로만 남는다. 기본값과 같은 10초지만 두 값이 한 쌍이라는 것을 여기 적어 둔다.
    stop_grace_period: 10s
    restart: 'no'

  nginx:
    image: nginx:1.30.4-alpine
    environment:
      # 베이스 이미지의 entrypoint가 기동할 때마다 `/docker-entrypoint.d/`·`/etc/nginx/conf.d/`
      # 같은 컨테이너 내부 경로를 로그에 찍는다. 이 스토리의 계약은 응답뿐 아니라 로그에도
      # 내부 경로를 남기지 않는 것이다. 공식 이미지가 제공하는 스위치로 그 출력을 끈다.
      # nginx 자신의 access·error 로그는 그대로 stdout·stderr로 나간다.
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    depends_on:
      backend:
        # nginx는 기동 시점에 `backend`를 한 번 해석한다. 그 전에 컨테이너가 떠 있어야 한다.
        condition: service_healthy
    ports:
      # 호스트 포트는 4183으로 시작하지 않는 값을 쓴다. Playwright의 origin 비교가 포트
      # 접두사에 취약했던 이력이 있고(4183 대 41830), preview 기본 포트와도 겹치지 않게 한다.
      - '127.0.0.1:18080:80'
    volumes:
      # 두 마운트 모두 읽기 전용이다. 컨테이너가 저장소 파일을 고칠 경로를 만들지 않는다.
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/bokrilog.conf:/etc/nginx/conf.d/default.conf:ro
      # upstream 블록 하나(Story 3.8). 본문이 include한다. 운영은 같은 자리에 활성 슬롯을 가리키는 파일을 둔다.
      - ../nginx/upstream-backend.conf:/etc/nginx/bokrilog/upstream-backend.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: 'no'
