# BokriLog 동일 출처 셸 — 개발·CI 공용 구성.
#
# 이 파일은 production 프로필이 아니다. image digest 고정, 자원 제한, 로그 전송(Alloy),
# blue/green 슬롯, 컨테이너 권한 강화(`user`·`read_only`·`cap_drop`)는 Story 3.8과 배포 작업이
# 소유한다. 여기서 하는 일은 하나다.
# "빌드된 프런트엔드 산출물과 백엔드 jar를 하나의 origin 뒤에 세워 실제 배포 형태를 재현한다."
#
# 그래서 두 서비스의 권한 모양이 다르다. 백엔드는 자기 이미지가 비-root 사용자를 만들어 쓰지만
# nginx 서비스에는 `user`·`read_only`·`cap_drop`·자원 제한이 없다. 공식 이미지의 entrypoint가
# root로 시작해 워커를 내리는 구조를 이 프로필에서 되짚을 이유가 없기 때문이며, 개발·CI 전용
# 스택이라 감수하는 선택이다. 실수로 빠진 것이 아니라 위 목록이 소유한다는 뜻이다.
#
# 실행 전제: `frontend/dist`와 `backend/build/libs/bokrilog-backend.jar`가 이미 존재한다.
# 이 구성은 어느 쪽도 빌드하지 않는다. CI가 두 품질 job의 산출물을 재빌드 없이 소비하는 것과
# 로컬 실행을 같은 모양으로 맞춘다(CI-PLAN §8).
#
# 명령은 `deploy/compose/verify-same-origin.sh`가 소유한다. 직접 다룰 때는
# `docker compose --file deploy/compose/compose.yaml ...`로 저장소 루트에서 실행한다.

name: bokrilog

services:
  backend:
    build:
      # 컨텍스트는 `backend/`다. `.dockerignore`가 미리 빌드한 jar 하나만 남긴다.
      context: ../../backend
      dockerfile: Dockerfile
    # 포트를 게시하지 않는다. 바깥에서 백엔드에 직접 닿는 경로를 만들면 그 순간
    # "동일 출처"는 구성이 아니라 관례가 된다.
    expose:
      - '8080'
    environment:
      # 자격정보가 아니다. 컨테이너 안 포트를 Dockerfile·nginx 설정과 한 값으로 묶는다.
      SERVER_PORT: '8080'
    healthcheck:
      # alpine 베이스의 busybox wget이다. 이미지에 도구를 더 넣지 않는다.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/api/status']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # `application.yml`의 `spring.lifecycle.timeout-per-shutdown-phase`(5초)보다 길어야 한다.
    # 짧으면 graceful shutdown이 끝나기 전에 SIGKILL이 도착해 `server.shutdown: graceful`이
    # 설정으로만 남는다. 기본값과 같은 10초지만 두 값이 한 쌍이라는 것을 여기 적어 둔다.
    stop_grace_period: 10s
    restart: 'no'

  nginx:
    image: nginx:1.30.4-alpine
    environment:
      # 베이스 이미지의 entrypoint가 기동할 때마다 `/docker-entrypoint.d/`·`/etc/nginx/conf.d/`
      # 같은 컨테이너 내부 경로를 로그에 찍는다. 이 스토리의 계약은 응답뿐 아니라 로그에도
      # 내부 경로를 남기지 않는 것이다. 공식 이미지가 제공하는 스위치로 그 출력을 끈다.
      # nginx 자신의 access·error 로그는 그대로 stdout·stderr로 나간다.
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    depends_on:
      backend:
        # nginx는 기동 시점에 `backend`를 한 번 해석한다. 그 전에 컨테이너가 떠 있어야 한다.
        condition: service_healthy
    ports:
      # 호스트 포트는 4183으로 시작하지 않는 값을 쓴다. Playwright의 origin 비교가 포트
      # 접두사에 취약했던 이력이 있고(4183 대 41830), preview 기본 포트와도 겹치지 않게 한다.
      - '127.0.0.1:18080:80'
    volumes:
      # 두 마운트 모두 읽기 전용이다. 컨테이너가 저장소 파일을 고칠 경로를 만들지 않는다.
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/bokrilog.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: 'no'
