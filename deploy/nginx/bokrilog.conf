# BokriLog 동일 출처 진입점.
#
# 이 파일 하나가 서비스 경계다. 브라우저는 이 origin에서 화면과 `/api` 응답을 함께 받고,
# 그 밖의 어떤 주소도 보지 않는다.
#
# 정본: ARCHITECTURE-SPINE.md AD-4(동일 출처 셸), CI-PLAN §8, deferred 항목 14(보안 응답 헤더).
# 배치: `nginx:1.30.4-alpine`의 `/etc/nginx/conf.d/default.conf` 자리에 읽기 전용으로 마운트한다.
#       기본 이미지의 `nginx.conf`가 이 파일을 http 블록 안으로 include하며 mime.types도 그 안에 있다.

# `error_page`가 쓰는 named location은 `if`·`try_files`와 달리 재진입하지 않는다.
# 오류 본문을 한 곳에 모아 두기 위한 장치이며 그 자체로 라우팅을 늘리지 않는다.

# --- 접근 로그 형식 ---------------------------------------------------------
# 기본 `combined` 형식에는 요청 식별자가 없다. 그 상태로는 "두 계층의 로그를 한 ID로 잇는다"가
# 주석에만 있는 주장이 된다. 형식에 `$request_id`를 넣어 실제로 이을 수 있게 한다.
# 같은 값이 응답의 `X-Request-Id` 헤더로 클라이언트에게도, 요청 헤더로 백엔드에게도 간다.
#
# `log_format`은 http 컨텍스트 전용이다. server 블록 안에는 둘 수 없다. 이 파일은 기본 이미지의
# `nginx.conf`가 http 블록 안에서 include하므로 server 바깥의 이 위치가 곧 그 컨텍스트다.
#
# 남기는 값은 요청 자체의 사실과 nginx가 만든 식별자뿐이다. 내부 경로·업스트림 주소·환경 변수
# 이름을 형식에 넣지 않는다. 그 셋은 응답에도 로그에도 남기지 않는 것이 이 스토리의 계약이다.
log_format bokrilog '$remote_addr $request_id "$request" $status $body_bytes_sent $request_time';

upstream bokrilog_backend {
  # compose 네트워크의 서비스 이름이다. 외부 주소를 쓰지 않는다.
  # nginx는 이 이름을 기동 시점에 한 번 해석한다. 백엔드가 멈추면 연결이 거부되거나(502)
  # 연결이 timeout되고(504), 어느 쪽이든 아래 `@upstream_unavailable`이 공통 오류 계약으로
  # 응답한다. 둘 중 무엇이 되는지는 커널의 이웃 캐시 상태가 정하며 우리가 고를 수 없다.
  server backend:8080;
}

server {
  listen 80;
  server_name _;

  # 응답의 `Server` 헤더에서 버전을 지운다. 남는 값은 `nginx`뿐이다.
  # 업스트림이 보낸 `Server`·`Date`는 nginx가 기본으로 감춘다.
  server_tokens off;

  root /usr/share/nginx/html;

  # 요청 본문을 받는 엔드포인트가 아직 없다. 큰 본문을 업스트림까지 옮기지 않는다.
  # 이 한도를 넘는 요청은 413이며, 아래 `error_page`가 같은 JSON 계약으로 답한다.
  client_max_body_size 64k;

  # 위 형식으로 모든 요청을 기록한다. 이미지가 이 경로를 `/dev/stdout`으로 심볼릭 링크해 두므로
  # 로그는 그대로 컨테이너 stdout으로 나간다.
  access_log /var/log/nginx/access.log bokrilog;

  # --- 보안 응답 헤더 ------------------------------------------------------
  # `always`가 붙어야 4xx·5xx 응답에도 실린다. 이 헤더들은 오류 화면에서 더 중요하다.
  #
  # add_header는 상속 규칙이 특이하다. 하위 블록에 add_header가 하나라도 있으면 상위 블록의
  # 것이 전부 사라진다. 그래서 이 파일에서 add_header는 여기 한 곳에만 둔다.
  #
  # CSP는 이 헤더가 유일한 정의다. `<meta>` CSP를 쓰지 않는다. 그 자리는 문서 본문이라
  # 문서를 바꿀 수 있는 경로가 곧 정책을 바꿀 수 있는 경로가 된다.
  #   default-src 'none'   -- 명시하지 않은 것은 전부 막는다.
  #   script-src 'self'    -- 번들은 동일 출처 파일이다. 인라인 스크립트가 없다.
  #   style-src 'self'     -- 스타일시트도 동일 출처 파일이다.
  #   style-src-attr 'unsafe-inline'
  #                        -- index.html의 noscript 폴백이 인라인 style 속성을 쓴다.
  #                           JS 없이는 tokens.css가 로드되지 않아 폴백 값이 속성에 있어야 한다.
  #                           이 지시어를 빼면 JS를 끈 사용자의 고지 화면이 스타일 없이 나온다.
  #   img-src 'self' data: -- 파비콘이 인라인 data: URI다. 외부 파일이면 /favicon.ico 요청이 생긴다.
  #   connect-src 'self'   -- fetch·XHR·WebSocket을 동일 출처로 묶는다.
  #   base-uri 'none'      -- 주입된 <base>로 상대 URL을 통째로 옮기는 경로를 막는다.
  #   form-action 'none'   -- 아직 폼이 없다. 폼이 생기면 그 스토리가 'self'로 연다.
  #   frame-ancestors 'none' -- clickjacking. X-Frame-Options와 함께 둔다.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  # 요청 식별자를 클라이언트에게도 돌려준다. 오류 본문의 correlationId와 같은 값이며 성공 응답에도
  # 실린다. 사용자가 화면에서 읽은 ID로 위 access log와 백엔드 로그를 함께 찾을 수 있다.
  # 위 네 헤더와 반드시 한 블록에 있어야 한다(같은 add_header 상속 규칙).
  add_header X-Request-Id $request_id always;

  # --- 업스트림 프록시 공통 설정 -------------------------------------------
  # `proxy_pass`만 location에 두고 나머지 proxy 설정은 server 수준에 둔다. 프록시하지 않는
  # location에서는 아무 일도 하지 않고, `/api` 매칭이 아래처럼 두 location으로 나뉘어도 설정은
  # 한 벌로 남는다. 두 벌이면 한쪽만 고쳐지는 날이 온다.
  #
  # 상속 규칙은 add_header와 같다. 아래 location 중 하나라도 자기 `proxy_set_header`를 두면
  # 그 location에서는 여기 있는 것이 전부 사라진다. 그래서 어느 location에도 두지 않는다.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # 진입점과 애플리케이션이 같은 요청 식별자를 쓴다. 오류 응답의 correlationId가 이 값이다.
  proxy_set_header X-Request-Id $request_id;
  # 업스트림에 연결을 재사용시키려면 hop-by-hop 헤더를 비워야 한다.
  proxy_set_header Connection "";

  # 백엔드가 낸 오류 본문은 이미 공통 계약이다. nginx가 가로채 다시 만들지 않는다.
  # (기본값이지만 명시한다. 켜지는 순간 백엔드의 404가 nginx의 정적 404로 바뀐다.)
  proxy_intercept_errors off;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # --- API 프록시 ----------------------------------------------------------
  # 경로 구분자까지 포함해 매칭한다. `^~ /api` 하나로 두면 접두사 비교라서 `/apifoo`·`/api-docs`·
  # `/apiary`까지 백엔드로 간다. "`/api`만 백엔드로 프록시한다"는 계약이 문자 접두사로 새는 지점이
  # 여기다. 받는 것은 `/api/...`와 `/api` 정확히 이 두 가지뿐이다.
  #
  # `^~`는 정규식 location보다 먼저 확정한다. 이 파일에 정규식 location은 없지만,
  # 나중에 누가 하나 더해도 `/api/`가 정적 처리로 새지 않는다.
  location = /api {
    proxy_pass http://bokrilog_backend;
  }

  location ^~ /api/ {
    proxy_pass http://bokrilog_backend;
  }

  # --- 정적 SPA ------------------------------------------------------------
  # `frontend/dist`를 origin 루트에 그대로 제공한다. 번들의 asset URL이 `/assets/...`
  # 루트 절대경로이므로 하위 경로에 mount할 수 없다.
  location / {
    # 읽기 메서드가 아니면 파일을 찾기 전에 되돌린다. 정적 핸들러가 먼저 파일을 찾으면
    # 그 파일의 MIME 타입(`text/html`)이 응답에 박히고, 그 뒤 `error_page`가 JSON 본문을
    # 실어도 `Content-Type`은 `text/html`로 남는다. 본문과 헤더가 어긋난 응답이 나간다.
    #
    # location 안의 `if`는 `return`과 `rewrite ... last`에서만 안전하다는 것이 nginx의
    # 공식 입장이고, 여기서 하는 일이 정확히 그 `return`이다.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # index.html로 되돌리는 SPA 폴백을 두지 않는다. 이 저장소에는 아직 라우터가 없고,
    # 폴백이 있으면 존재하지 않는 경로가 200 + 진입 화면으로 응답해 "없음"을 숨긴다.
    try_files $uri $uri/index.html =404;
  }

  # --- 공통 오류 계약 ------------------------------------------------------
  # Spring(4xx·500)과 같은 JSON 모양을 nginx도 돌려준다. correlation ID는 `$request_id`이며
  # 같은 값이 위 `X-Request-Id`(응답 헤더·프록시 요청 헤더)와 access log에 함께 남는다.
  #
  # `= @이름`이 아니라 `@이름`으로 쓴다. `=`를 붙이면 최종 상태 코드를 named location이 정하게
  # 되어 504(읽기 timeout)와 503(과부하)이 전부 `return 502`로 뭉개진다. 오류는 실제 상태를
  # 그대로 반영해야 하므로 상태 코드는 원래 오류가 소유하고, named location은 본문만 만든다.
  # 그래서 예컨대 413은 상태 413에 `BAD_REQUEST` 본문으로 나간다.
  #
  # nginx가 이 구성에서 스스로 만들 수 있는 상태를 빠짐없이 적는다. 하나라도 빠지면 그 경로만
  # nginx 기본 HTML로 나가 클라이언트가 두 가지 오류 형식을 다뤄야 한다. 특히 400·413·414·431은
  # 위 `client_max_body_size`와 기본 헤더·URI 한도만으로 바로 도달할 수 있다.
  error_page 400 408 413 414 431 @bad_request;
  error_page 404 @not_found;
  error_page 405 @method_not_allowed;
  error_page 500 501 @internal_error;
  error_page 502 503 504 @upstream_unavailable;

  # 다섯 named location 모두 `types { }`로 MIME 맵을 비운다. nginx는 `return`의 Content-Type을
  # 정할 때 요청 URI의 확장자를 먼저 찾고, 못 찾을 때만 `default_type`을 쓴다. 맵을 비우지
  # 않으면 `/nope.js`의 404가 본문은 JSON인데 `Content-Type: application/javascript`로 나간다.
  #
  # 아래 code·message 문자열은 백엔드 `ApiErrorHandler`의 상수와 한 글자도 다르면 안 된다.
  # `verify-same-origin.sh`가 두 계층이 만든 같은 코드의 본문을 서로 비교해 이를 고정한다.
  location @bad_request {
    types { }
    default_type application/json;
    return 400 '{"code":"BAD_REQUEST","message":"요청이 올바르지 않습니다. 입력을 확인해 주세요.","correlationId":"$request_id"}';
  }

  location @not_found {
    types { }
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"요청한 경로를 찾을 수 없습니다.","correlationId":"$request_id"}';
  }

  location @method_not_allowed {
    types { }
    default_type application/json;
    return 405 '{"code":"METHOD_NOT_ALLOWED","message":"요청한 방식으로는 처리할 수 없습니다.","correlationId":"$request_id"}';
  }

  location @internal_error {
    types { }
    default_type application/json;
    return 500 '{"code":"INTERNAL_ERROR","message":"요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.","correlationId":"$request_id"}';
  }

  # 백엔드 비가용. nginx 기본 HTML 오류 화면은 upstream 주소도 nginx 버전도 담지 않지만
  # 형식이 HTML이라 클라이언트가 두 가지 오류 형식을 다뤄야 한다. 계약을 하나로 유지한다.
  # 502(연결 거부)·503(과부하)·504(읽기 timeout)가 모두 여기로 오지만 상태 코드는 각자 남는다.
  location @upstream_unavailable {
    types { }
    default_type application/json;
    return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.","correlationId":"$request_id"}';
  }
}
