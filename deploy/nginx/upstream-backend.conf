# 개발·CI의 백엔드 upstream(Story 3.8). `deploy/nginx/bokrilog.conf`가 include하는 블록 하나만 담는다.
#
# `deploy/compose/compose.yaml`이 `/etc/nginx/bokrilog/upstream-backend.conf`에 읽기 전용으로 마운트한다. 운영은 이 파일을 쓰지
# 않는다 — 배포 스크립트가 활성 슬롯을 가리키는 같은 모양의 파일을 상태 디렉터리에 써 넣는다(`deploy/production/deploy.sh`).
upstream bokrilog_backend {
  server backend:8080;
}
