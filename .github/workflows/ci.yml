# BokriLog 필수 CI. 정본은 CI-PLAN.md(§1 job 구조, §5 이벤트, §6 실행 순서, §8 확장,
# §11 보안, §13 보호 규칙)이고 구현 계약은 Story SPEC이 소유한다.
#
# Story 1.2에서 backend와 deploy가 생기면서 단일 job을 CI-PLAN §1의 병렬 구조로 전환했다.
#
#   changes ──> frontend-quality ──┐
#           └─> backend-quality ───┼─> same-origin-integration ─┐
#                                  └────────────────────────────┴─> ci-required
#
# branch protection이 참조하는 이름은 전환 전후 모두 `ci-required`다. 이제 이 job은 검사를
# 직접 실행하지 않고 선행 job의 결과만 집계한다(CI-PLAN §5 CI-D5).
#
# 두 품질 job은 `same-origin-integration`이 소비할 산출물을 만든다. 통합 job은 그 산출물을
# 다시 빌드하지 않는다. 재빌드하면 통합 시험이 검증하는 바이트가 품질 job이 검증한 바이트와
# 같다는 보장이 사라진다(CI-PLAN §8). 통합 입력 artifact의 retention은 1일이다.
#
# 판정 논리는 `.github/scripts/`의 셸 스크립트가 소유한다. YAML 안의 인라인 스크립트는
# 저장소의 시험으로 고정할 수 없기 때문이다(CI-PLAN §5).
#   verify-merge-commit.sh -- PR merge commit의 부모가 이벤트의 base·head와 같은지 검증
#   classify-changes.sh    -- 문서-only 여부 판정. `docs-only`·`reason`을 GITHUB_OUTPUT과
#                             GITHUB_STEP_SUMMARY에 기록
#   aggregate-results.sh   -- 선행 job 결과를 모아 병합 가능 여부 판정
#   test-ci-scripts.sh     -- 위 세 스크립트와 이 파일의 계약 시험. changes job 안에서
#                             조건 없이 실행한다
#
# 예외는 `변경 분류` 단계의 인라인 블록 하나다. "어느 분류기를 실행할지" 고르는 일은
# 분류기 자신이 결정할 수 없으므로 스크립트 밖에 있어야 한다. 대신 그 선택을
# test-ci-scripts.sh가 이 파일에서 직접 단정해 고정한다.
name: CI

on:
  # `branches`는 source branch가 아니라 PR의 target branch다.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # 배포 권한이 없는 수동 진단. release evidence나 배포 입력이 될 수 없다.
  workflow_dispatch:

# top-level `paths` 필터를 두지 않는다. workflow가 생략돼 `ci-required` status가
# 생성되지 않는 분기를 막는다. 문서-only 여부는 changes job이 분류한다.

permissions:
  contents: read

concurrency:
  # PR: workflow·target branch·PR 번호가 group을 만든다. 같은 PR의 이전 실행만 취소하고
  #     다른 PR은 독립적으로 진행한다.
  # push·workflow_dispatch: run_id를 넣어 실행마다 group을 분리한다. 통합 결과를
  #     취소하지도 직렬화하지도 않는다.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.base.ref || github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    # 모든 PR의 secret 검사와 변경 분류를 먼저 처리한 뒤 품질 job을 연다(CI-PLAN §8).
    name: changes
    # Playwright 지원 Ubuntu 고정 버전. `ubuntu-latest`는 러너 갱신이 CI 판정을 바꾼다.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action은 PR 이벤트에서 `GET /repos/{o}/{r}/pulls/{n}/commits`로
      # 스캔할 commit 범위를 정한다. 변경 분류가 아니라 이 호출 때문에 필요한 읽기 권한이다.
      pull-requests: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이벤트가 고정한 commit이다. PR에서는 그 시점의 merge commit이며,
          # 움직이는 `refs/pull/<n>/merge`를 다시 해석하지 않는다.
          # 후속 job도 이 값을 그대로 checkout한다.
          ref: ${{ github.sha }}
          # 변경 분류(merge commit 부모 비교)와 gitleaks의 commit 범위 스캔이 전체 이력을 요구한다.
          # 이 방식은 토큰에 권한을 더하지 않고 PR·push 양쪽에서 같게 동작한다.
          fetch-depth: 0
          # 이후 단계는 git 인증을 쓰지 않는다. 토큰을 작업 트리의 git config에 남기지 않는다.
          persist-credentials: false

      - name: PR merge commit 검증
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # 스크립트로 분리해 저장소의 시험이 계약을 고정할 수 있게 한다.
        # `bash <경로>`로 부른다. 실행 비트가 체크아웃에서 유실돼도 동작이 같다.
        run: bash .github/scripts/verify-merge-commit.sh

      - name: committed-secret 검사
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # workflow 토큰이다. repository·environment·provider secret을 PR에 전달하지 않는다.
          GITHUB_TOKEN: ${{ github.token }}
          # 소유자 `sh-9610`은 type `User`라 라이선스 키가 필요 없다.
          # 저장소를 조직으로 옮기면 GITLEAKS_LICENSE가 필요해지므로 그때 재검토한다.
          #
          # action이 내장한 기본값과 같은 값을 명시해 스캐너 버전을 파일에서 읽을 수 있게 둔다.
          # 버전 갱신은 별도 review PR로 한다.
          GITLEAKS_VERSION: '8.24.3'
          # PR 리뷰 코멘트 작성은 `pull-requests: write`를 요구한다. 이 job의 토큰은 읽기 전용이다.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # 이 실행이 보관하는 artifact는 통합 입력과 Playwright 진단뿐이다(CI-PLAN §11).
          # 결과는 job summary와 단계 로그로만 본다.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # 탐지가 있을 때만 표를 그린다. 값은 `--redact`로 가려지지만 표에는 commit 작성자
          # email이 들어간다. git 이력에 이미 있는 저장소 소유자 자신의 값이고, 탐지는
          # 어차피 사람이 판단해야 하는 중단 사건이라 유일한 진단 경로를 남겨 둔다.
          GITLEAKS_ENABLE_SUMMARY: 'true'

      - name: CI 스크립트 계약 시험
        # `classify-changes.sh`의 분류 규칙, `verify-merge-commit.sh`의 부모 검증,
        # `aggregate-results.sh`의 집계 판정이 CI 판정 전체를 좌우한다(CI-PLAN §5).
        # 임시 git fixture로 세 스크립트를 실제로 실행해 값·enum·종료 코드·오류 메시지를
        # 단정하고, 이 파일의 job 구조 계약도 함께 단정한다.
        #
        # 조건 없이 항상 실행한다. `.github/**` 변경에서만 돌게 하려면 변경 파일을
        # 다시 분류해야 하는데, 그러면 분류기를 분류기로 게이트하게 된다. 이 시험은
        # 러너에서 몇 초면 끝나므로 무조건 실행이 더 싸고 우회 경로가 없다.
        # 분류 단계보다 앞에 두어 규칙이 깨진 채로 판정이 나가지 않게 한다.
        run: bash .github/scripts/test-ci-scripts.sh

      - name: 변경 분류
        id: classify
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # 스크립트로 분리해 위 단계가 계약을 고정할 수 있게 한다.
        # `GITHUB_OUTPUT`에 `docs-only`와 `reason`을 쓰고 `GITHUB_STEP_SUMMARY`에도 같은
        # 값을 남긴다. 종료 코드는 항상 0이며 판정 불가는 `no-comparison-base`로 표현해
        # 전체 검사를 켠다.
        #
        # PR 이벤트에서는 체크아웃된 head가 아니라 target base의 승인된 분류기를 실행한다
        # (CI-PLAN §5: "PR이 수정한 classifier가 자기 검사를 축소할 수 없다"). head의
        # 분류기를 그대로 쓰면 규칙에 한 줄을 더하는 것만으로 그 PR의 제품 검사를
        # 통째로 건너뛸 수 있다. base에 파일이 없으면(이 PR이 최초 도입) fail-closed로
        # head 것을 쓰되 어떤 정의를 썼는지 로그에 남긴다.
        # push·workflow_dispatch는 비교 대상 base가 없으므로 체크아웃된 정의를 쓴다.
        run: |
          set -euo pipefail
          classifier='.github/scripts/classify-changes.sh'
          if [ "${GITHUB_EVENT_NAME}" = 'pull_request' ]; then
            approved="${RUNNER_TEMP}/classify-changes.base.sh"
            if git show "${PR_BASE_SHA}:.github/scripts/classify-changes.sh" >"${approved}" 2>/dev/null \
              && [ -s "${approved}" ]; then
              classifier="${approved}"
              echo "분류기 출처: target base ${PR_BASE_SHA}의 승인된 정의"
            else
              rm -f "${approved}"
              echo "::warning::target base ${PR_BASE_SHA}에 classify-changes.sh가 없다. 체크아웃된 head의 정의로 분류한다."
            fi
          else
            echo "분류기 출처: 체크아웃된 ${GITHUB_SHA}"
          fi
          bash "${classifier}"

  frontend-quality:
    name: frontend-quality
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changes` job이 검증한 그 commit이다. 움직이는 ref를 다시 해석하지 않는다.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `frontend/.nvmrc`가 Node major의 정본이다. `.npmrc`의 engine-strict가
          # 다른 major에서 설치를 즉시 실패시킨다.
          node-version-file: frontend/.nvmrc
          # npm 다운로드 캐시만 쓴다. `node_modules`와 Playwright 브라우저는 캐시하지 않는다.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존 설치
        run: npm --prefix frontend ci --prefer-offline --no-audit --fund=false

      - name: 타입 검사
        run: npm --prefix frontend run typecheck

      # 아래 세 단계는 spec-frontend-lint-policy.md가 합의한 품질 정책이다(CI-PLAN §6·§8).
      # 타입 검사 뒤, 빌드 앞에 둔다. 빠른 실패를 브라우저 준비보다 먼저 찾는다(CI-PLAN §10).
      # 규칙과 예외는 frontend/eslint.config.ts·stylelint.config.js·.prettierrc.json이 소유하고,
      # 규칙이 실제로 위반을 잡는지는 frontend/lint-policy.test.ts가 Vitest 단계에서 고정한다.
      - name: ESLint
        run: npm --prefix frontend run lint

      - name: stylelint
        run: npm --prefix frontend run lint:css

      - name: Prettier 검사
        run: npm --prefix frontend run format:check

      - name: 프로덕션 빌드
        run: npm --prefix frontend run build

      - name: Vitest
        timeout-minutes: 2
        run: npm --prefix frontend run test

      - name: Chromium headless shell 설치
        # 어느 project도 `channel`을 지정하지 않으므로 Playwright는 headless Chromium을
        # `chromium-headless-shell`로 해석한다. channel을 추가하거나 headed 실행을
        # 필수 경로에 넣으면 `--only-shell` 설치와 어긋나므로 그때 전체 Chromium을 설치한다.
        run: npm --prefix frontend exec -- playwright install chromium --with-deps --only-shell

      - name: Chromium E2E
        id: e2e
        timeout-minutes: 4
        env:
          # GitHub 러너가 이미 CI=true를 설정하지만 명시해 로컬 재현 명령과 같게 둔다.
          # playwright.config.ts가 이 값으로 forbidOnly와 workers=1을 켠다. retries는 항상 0이다.
          CI: 'true'
        # 앞 단계가 만든 `dist`를 preview로 제공한다. 여기서 다시 빌드하지 않는다.
        run: npm --prefix frontend run test:e2e:run

      - name: 통합 입력 업로드 (frontend dist)
        # 이 업로드가 producer 성공 조건의 일부다(CI-PLAN §8). 시험이 통과해도 산출물이
        # 올라가지 않으면 통합 job이 검증할 대상이 없으므로 job을 실패시킨다.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
          # 통합 입력은 해당 run에서만 쓴다. 장기 보존하지 않는다(CI-PLAN §8·§10).
          retention-days: 1
          if-no-files-found: error
          overwrite: false

      - name: 실패 진단 artifact 업로드
        # 실패·timeout·취소에서만 올린다. 성공한 PR의 산출물은 보관하지 않는다.
        # report·trace·screenshot만 담기며 backend·자격정보·사용자 데이터가 없다.
        if: ${{ (failure() || cancelled()) && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          # `ignore`면 report·trace 경로가 어긋나도 이 단계가 조용히 성공해 실패한 실행에
          # 진단물이 없다는 사실을 아무도 모른다. `warn`은 job을 실패시키지 않으면서
          # 경로 표류를 로그에 남긴다.
          if-no-files-found: warn

  backend-quality:
    name: backend-quality
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    # Story 1.3이 Testcontainers를 들이면서 이 job은 실제 PostgreSQL 컨테이너를 띄운다. 콜드
    # 실행에는 `postgres:18.6-alpine` 내려받기가 더해지고, 동시성 시험은 잠금 경합을 실제로
    # 기다린다. 10분은 그 둘이 겹친 실행을 끊어 버릴 수 있는 값이라 올린다.
    #
    # CI-PLAN §4·§10의 backend 예산 8분은 이 상한과 별개로 계속 측정한다. 이 값은 목표가 아니라
    # 멈춘 job을 끊는 상한이며, `same-origin-integration`이 17분을 쓰는 것과 같은 이유다.
    # 실측이 몇 회 쌓이면 두 값을 CI-PLAN 새 버전이 함께 보정한다.
    #
    # Story 2.11이 15분에서 20분으로 올렸다. PR #49의 이 job은 11분 5초였고, 같은 시험의 로컬
    # 실행보다 1분쯤 길었다. 2.11의 로컬 `clean build`가 12분 56초라 CI는 14분 안팎이 되고, 15분은
    # 러너 편차 하나로 끊긴다.
    #
    # Story 2.12가 20분에서 25분으로 올렸다. 로컬 `clean build`가 15분 54초, 리뷰 보강 시험을 더한 뒤
    # 16분 59초가 됐다(정밀 검증 시험 묶음이 약 4분을 더했다). PR #52의 이 job이 같은 시험의 로컬 실행과
    # 거의 같았으므로 CI도 17분 안팎이고, 20분은 러너 편차와 콜드 이미지 내려받기가 겹치면 여유가 없다.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: JDK 준비
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          # `ARCHITECTURE-SPINE.md` Stack 표의 Java 25 LTS다. Gradle의 toolchain
          # 자동 프로비저닝은 backend/gradle.properties가 꺼 두었으므로 이 JDK가 실제로 쓰인다.
          distribution: temurin
          java-version: '25'
          # Gradle 다운로드 캐시는 npm과 별도 namespace다(CI-PLAN §8).
          # 키에 OS·toolchain·빌드 스크립트가 들어간다.
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Gradle 빌드
        # compile, 시험, 실행 가능한 jar를 한 번에 만든다.
        #
        # Story 1.3부터 이 한 단계가 Modulith 경계 검사와 실제 PostgreSQL 통합 시험까지 포함한다.
        # Testcontainers가 러너의 docker 데몬으로 `postgres:18.6-alpine`을 직접 띄우므로 job에
        # 서비스 컨테이너도, docker를 설치하는 action도 더하지 않는다. 아래 통합 job이 이미
        # `docker compose`를 그대로 부르는 것이 그 데몬의 증거다.
        #
        # 단계를 쪼개지 않는 것도 선택이다. `.github/scripts/test-ci-scripts.sh`가 이 job의 단계
        # 목록을 전문으로 고정하므로, 시험을 별도 단계로 빼면 그 계약부터 갱신해야 한다.
        # 제공자 자격정보는 여전히 필요 없다.
        run: bash backend/gradlew --project-dir backend --no-daemon build

      - name: 통합 입력 업로드 (backend jar)
        # frontend와 같은 이유로 producer 성공 조건이다(CI-PLAN §8).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/build/libs/bokrilog-backend.jar
          retention-days: 1
          if-no-files-found: error
          overwrite: false

      - name: 실패 진단 artifact 업로드
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  same-origin-integration:
    name: same-origin-integration
    needs: [changes, frontend-quality, backend-quality]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    # CI-PLAN §8이 적은 5분은 이 job이 무엇을 하는지 정해지기 전의 *시작* 값이다. 실제 단계
    # 예산의 합이 그 값을 넘는다. 아래는 단계별 상한이고, Story 1.1 회귀 하나가 이미 6분이라
    # 5분으로는 정상적인 실행조차 러너가 죽인다. 필수 검사를 빼서 맞추지 않고 예산을 고친다
    # (CI-PLAN §10 "필수 계약을 줄여 시간을 맞추지는 않는다").
    #
    #   checkout·통합 입력 2건 내려받기                                    1분
    #   동일 출처 검증(docker build + `up --wait` 180s + I/O 표 단언)      5분
    #   Node 준비 + `npm ci`                                               2분
    #   Chromium headless shell 설치(`--with-deps` apt)                    2분
    #   Story 1.1 회귀                                                     6분 (단계 timeout)
    #   compose 정리 + 실패 진단 업로드                                    1분
    #                                                                    ---------
    #                                                                     17분
    #
    # 회귀 단계는 Story 2.11이 4분에서 6분으로 올렸다(playwright `globalTimeout` 5분). PR #49에서
    # 이미 2분 30초(59건)였고, 2.11이 실제 스택의 동기화 왕복을 더했다.
    #
    # `npm ci`와 Chromium 설치는 `frontend-quality`가 이미 한 일을 되풀이한다. 그 중복을 없애는
    # 편이 예산을 늘리는 것보다 낫지만 이 스토리 범위 밖이라 `deferred-work.md`에 남겼다.
    # CI-PLAN §10의 PR wall-clock p95 8분은 이 상한과 별개로 계속 측정한다. 이 값은 목표가
    # 아니라 멈춘 job을 끊는 상한이다.
    timeout-minutes: 17
    permissions:
      contents: read

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 통합 입력 내려받기 (frontend dist)
        # 두 품질 job이 검증한 그 산출물이다. 여기서 다시 빌드하지 않는다(CI-PLAN §8).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist

      - name: 통합 입력 내려받기 (backend jar)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/build/libs

      - name: 동일 출처 검증
        # I/O 표 전 행, 백엔드 비가용 502/504, 로그 누출 검사를 한 번에 돈다. 로컬과 같은 명령이다.
        # `--keep-stack`은 성공 시 백엔드를 다시 띄워 건강한 스택을 남긴다. 아래 Story 1.1 회귀가
        # 그 스택을 그대로 쓰므로 compose를 두 번 세우지 않는다. 실패하면 스크립트가 스스로 정리한다.
        run: bash deploy/compose/verify-same-origin.sh --keep-stack

      - name: Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존 설치
        # Playwright 실행에 필요한 설치다. `dist`는 위에서 내려받은 것을 그대로 쓴다.
        run: npm --prefix frontend ci --prefer-offline --no-audit --fund=false

      - name: Chromium headless shell 설치
        run: npm --prefix frontend exec -- playwright install chromium --with-deps --only-shell

      - name: Story 1.1 회귀 (Nginx origin)
        id: e2e
        timeout-minutes: 6
        env:
          CI: 'true'
          # 주입된 origin이 있으면 playwright.config.ts가 자체 preview 서버를 띄우지 않는다.
          # 시험 본문은 한 줄도 바꾸지 않는다.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
        run: npm --prefix frontend run test:e2e:run

      - name: compose 정리
        if: always()
        run: docker compose --file deploy/compose/compose.yaml down --remove-orphans --volumes

      - name: 실패 진단 artifact 업로드
        if: ${{ (failure() || cancelled()) && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: same-origin-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  ci-required:
    # 이 이름이 branch protection의 required status check 이름이다. 바꾸지 않는다.
    name: ci-required
    needs: [changes, frontend-quality, backend-quality, same-origin-integration]
    # 선행 job이 실패·취소·skip 어느 쪽이든 이 job은 반드시 실행되어 판정을 남겨야 한다.
    # 실행되지 않으면 required check가 영원히 대기 상태로 남는다.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # CI-PLAN §5: aggregator timeout은 1분이다.
    timeout-minutes: 1
    permissions:
      contents: read

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 필수 검사 집계
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          INTEGRATION_RESULT: ${{ needs.same-origin-integration.result }}
        # 판정은 스크립트가 소유한다. YAML 표현식은 저장소의 시험으로 고정할 수 없다.
        run: bash .github/scripts/aggregate-results.sh
