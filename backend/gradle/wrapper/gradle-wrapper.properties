# 배포판 내려받기는 다시 시도한다. 이 재시도는 시험 재시도와 성격이 다르다. 시험 재시도는 실패를
# green으로 덮어 원인을 지우지만, 여기서 다시 받는 대상은 `distributionSha256Sum`으로 내용이
# 고정된 바이트다. 다르게 받히면 검증이 막고, 같으면 원래 받았어야 할 그 파일이다. 한 번의 네트워크
# 순단이 필수 검사 `ci-required`를 떨어뜨리는 것만 막는다(CI-PLAN §10).
retries=2
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
