# toolchain 자동 프로비저닝을 끈다. 켜 두면 JDK 25가 없는 기기에서 Gradle이 조용히 JDK를
# 내려받아 "준비된 환경"과 "빌드가 만들어 낸 환경"을 구분할 수 없게 된다. 이 빌드는
# 로컬에 설치된 JDK 25만 쓰고, 없으면 명확한 오류로 멈춘다(DEVELOPMENT.md `## 백엔드`).
org.gradle.java.installations.auto-download=false

# 빌드 캐시·병렬화는 켜지 않는다. 단일 프로젝트라 이득이 없고, CI 판정이 캐시 상태에 의존하지
# 않아야 한다(CI-PLAN §10 "cache miss에서도 완전히 재생성할 수 있는 cache만 사용한다").
# 이 값은 프로젝트 병렬이다. 시험 클래스를 JVM 여럿에 나누는 시험 fork(`maxParallelForks`)는
# `build.gradle.kts`의 `Test` 설정이 따로 정한다.
org.gradle.parallel=false

# 러너와 개발 기기의 기본 인코딩 차이가 한국어 오류 메시지 리터럴을 깨뜨리지 않게 한다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
