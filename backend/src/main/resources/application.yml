# BokriLog 백엔드 설정.
#
# 자격정보·비밀·연결 문자열을 두지 않는다. 이 파일은 저장소에 그대로 커밋되며 모든 PR에서
# gitleaks가 검사한다. 자격정보 모양의 리터럴은 값이 가짜여도 넣지 않는다. 탐지가 나면
# 규칙을 완화하는 대신 그 리터럴을 없앤다.
#
# 연결 정보는 환경이 준다. `BOKRILOG_DB_URL`·`BOKRILOG_DB_USERNAME` 두 이름만 이 파일이 정하고
# 값은 어디에도 적지 않는다. 기본값을 비워 둔 것은 게으름이 아니라, 값을 주는 경로가 환경 하나뿐임을
# 분명히 하기 위해서다. 시험은 Testcontainers가 만든 연결을 `JdbcConnectionDetails`로 직접 넣으므로
# 이 두 이름이 필요 없고, 값이 없는 채로 실제 기동하면 datasource 생성이 즉시 실패한다.
#
# 비밀번호 항목이 없다. 개발·CI compose는 포트를 게시하지 않는 네트워크 안에서
# `POSTGRES_HOST_AUTH_METHOD: trust`로 뜨고, production 자격정보는 Story 3.8이 소유한다.
#
# Spring Session JDBC는 여기 없다. 세션은 Story 1.4·1.5의 범위다.

server:
  # 컨테이너 안의 포트다. 바깥에 열리는 포트는 Nginx 하나뿐이며 `deploy/compose/compose.yaml`이 정한다.
  port: 8080
  error:
    # 아래 네 값이 없으면 오류 응답에 예외 메시지·스택·바인딩 오류가 실린다.
    # 실제 오류 본문은 ApiErrorHandler가 소유하지만, 그 경로를 우회하는 응답이 생겨도
    # 프레임워크 기본값이 내부 정보를 흘리지 않도록 여기서도 함께 잠근다.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      # whitelabel HTML은 예외 종류와 경로를 그대로 보여 준다.
      enabled: false
  shutdown: graceful

spring:
  application:
    name: bokrilog
  lifecycle:
    # graceful shutdown의 기본 유예는 30초다. compose의 기본 `stop_grace_period`는 10초이므로
    # 기본값끼리 두면 SIGKILL이 먼저 도착해 "PID 1이 graceful stop을 받는다"는 Dockerfile의
    # 설명이 실제로는 성립하지 않는다. 이 값을 컨테이너 유예보다 짧게 잡고,
    # `deploy/compose/compose.yaml`이 `stop_grace_period`를 명시해 두 값을 한 쌍으로 묶는다.
    # 지금 이 애플리케이션에는 오래 걸리는 in-flight 요청이 없어 5초면 충분하다.
    timeout-per-shutdown-phase: 5s
  main:
    banner-mode: 'off'
    # 기동 로그의 "Starting ... (/app/app.jar started by ...)" 줄이 컨테이너 내부 경로와
    # 실행 사용자를 남긴다. 이 스토리는 로그에도 내부 경로를 남기지 않는 것이 계약이다.
    log-startup-info: false
  web:
    resources:
      # 백엔드는 정적 파일을 제공하지 않는다. 정적 자원은 Nginx가 루트에서 제공한다.
      # 이 매핑을 켜 두면 알 수 없는 경로가 정적 자원 조회로 흘러 404 처리 경로가 둘로 갈라진다.
      add-mappings: false
  datasource:
    url: ${BOKRILOG_DB_URL:}
    username: ${BOKRILOG_DB_USERNAME:}
  flyway:
    # 기본값과 같은 값이지만 적어 둔다. 마이그레이션 위치와 "지우지 않는다"는 두 가지는
    # 조용히 바뀌면 안 되는 값이다.
    locations: classpath:db/migration
    # `clean`은 스키마를 통째로 지운다. 어떤 프로필에서도 열지 않는다.
    clean-disabled: true
    # 이미 데이터가 있는 스키마를 baseline으로 삼고 넘어가지 않는다. 기대와 다르면 멈춘다.
    baseline-on-migrate: false

logging:
  level:
    root: info
    # 프레임워크의 요청 처리 로그는 warn까지만 남긴다. info·debug에는 핸들러 매핑과 요청 속성이
    # 함께 실려 내부 구조가 드러난다. 여기 남는 warn은 `No mapping for GET /nope`처럼 클라이언트가
    # 보낸 경로뿐이며 내부 경로·스택은 포함하지 않는다.
    # 처리하지 못한 예외는 ApiErrorHandler가 correlation ID만 붙여 직접 기록한다.
    org.springframework.web: warn

---
# 일회성 migration 역할(AD-12).
#
# 같은 이미지의 별도 프로세스다. 이 프로필에서만 Flyway가 실제로 스키마를 바꾸며
# (`SchemaValidationConfig`), 웹 서버를 띄우지 않으므로 마이그레이션이 끝나면 프로세스가 종료된다.
# 종료 코드가 곧 마이그레이션의 성공 여부다.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
