# BokriLog 백엔드 설정.
#
# 자격정보·비밀·연결 문자열을 두지 않는다. 이 파일은 저장소에 그대로 커밋되며 모든 PR에서
# gitleaks가 검사한다. 자격정보 모양의 리터럴은 값이 가짜여도 넣지 않는다. 탐지가 나면
# 규칙을 완화하는 대신 그 리터럴을 없앤다.
#
# 연결 정보는 환경이 준다. `BOKRILOG_DB_URL`·`BOKRILOG_DB_USERNAME` 두 이름만 이 파일이 정하고
# 값은 어디에도 적지 않는다. 기본값을 비워 둔 것은 게으름이 아니라, 값을 주는 경로가 환경 하나뿐임을
# 분명히 하기 위해서다. 시험은 Testcontainers가 만든 연결을 `JdbcConnectionDetails`로 직접 넣으므로
# 이 두 이름이 필요 없고, 값이 없는 채로 실제 기동하면 datasource 생성이 즉시 실패한다.
#
# 비밀번호 항목이 없다. 개발·CI compose는 포트를 게시하지 않는 네트워크 안에서
# `POSTGRES_HOST_AUTH_METHOD: trust`로 뜨고, production 자격정보는 Story 3.8이 소유한다.
#
# Story 1.4가 인증 설정을 들였고 Story 1.6·1.7이 두 번째·세 번째 제공자를 더했다.
# 이름만 이 파일이 정하고 값은 환경이 준다.
#   BOKRILOG_PUBLIC_BASE_URL             -- 브라우저가 보는 origin. redirect URI를 여기서 조립한다.
#   BOKRILOG_GOOGLE_CLIENT_ID            -- Google OAuth client
#   BOKRILOG_GOOGLE_CLIENT_SECRET        -- Google OAuth client secret
#   BOKRILOG_NAVER_CLIENT_ID             -- 네이버 애플리케이션 client
#   BOKRILOG_NAVER_CLIENT_SECRET         -- 네이버 애플리케이션 client secret
#   BOKRILOG_KAKAO_CLIENT_ID             -- 카카오 앱의 REST API client
#   BOKRILOG_KAKAO_CLIENT_SECRET         -- 카카오 앱의 client secret(콘솔에서 켜야 발급된다)
#   BOKRILOG_DEV_OIDC_INTERNAL_BASE_URL  -- `dev-oidc` 프로필에서 백엔드가 자기 스텁에 닿는 주소
# 제공자 등록은 제공자 단위로 독립해 fail-closed다. 공개 base URL과 그 제공자의 두 값이 모두
# 있어야 등록이 만들어지고, 하나라도 비면 그 제공자의 인증 시작만 공통 오류 계약으로 막힌다
# (`AuthSecurityConfig`). 한 제공자의 자격정보가 없어도 나머지 제공자의 로그인은 그대로 동작한다.
# 개발·CI 스택은 대신 아래 `dev-oidc` 프로필의 local OIDC 스텁으로 뜨며, 그 프로필과 실제 제공자
# 등록이 함께 활성이면 기동을 거부한다.

server:
  # 컨테이너 안의 포트다. 바깥에 열리는 포트는 Nginx 하나뿐이며 `deploy/compose/compose.yaml`이 정한다.
  port: 8080
  tomcat:
    # 리다이렉트의 `Location`을 origin-상대 경로로 내보낸다.
    #
    # 기본값(`false`)에서는 Tomcat이 `sendRedirect("/onboarding")`을 요청의 `Host` 헤더로 절대
    # URI로 바꾼다. 그런데 Nginx는 `proxy_set_header Host $host`로 포트를 잃은 값을 넘기므로
    # (`deploy/nginx/bokrilog.conf`) 그 절대 URI가 `http://127.0.0.1/onboarding`이 되어 브라우저가
    # 80번 포트로 간다. 로그인 성공 뒤의 모든 이동이 그렇게 끊긴다.
    #
    # `$http_host`나 `X-Forwarded-*`로 바꾸는 길은 둘 다 클라이언트가 제어하는 헤더를 목적지
    # 계산에 넣는다. 상대 경로로 내보내면 그 계산 자체가 없어지고 브라우저가 지금 보고 있는
    # origin에 그대로 붙인다. 이 앱의 모든 리다이렉트 목적지는 동일 출처 내부 경로이므로
    # (`AuthFlowHandlers`의 닫힌 허용 목록) 상대 경로가 곧 정확한 표현이다.
    #
    # 제공자로 보내는 인가 리다이렉트는 영향받지 않는다. 그 `Location`은 이미 절대 URI이고
    # Tomcat은 절대 URI를 그대로 둔다.
    use-relative-redirects: true
  servlet:
    session:
      cookie:
        # 브라우저에 두는 유일한 값이다. 불투명한 세션 식별자뿐이며 사용자 식별자·토큰·claim을
        # 담지 않는다. 실제 값은 Spring Session의 `DefaultCookieSerializer`가 base64로 실어 보낸다.
        #
        # 이름에서 기술 스택을 읽히지 않게 기본값(`SESSION`)을 쓰지 않는다.
        name: BOKRILOG_SESSION
        # 동일 출처 origin 전체가 이 앱이다. 경로를 좁히면 `/onboarding`·`/dashboard` 문서 요청이
        # 쿠키를 싣지 않아 세션 확인이 미인증으로 보인다.
        path: /
        # 스크립트가 읽을 수 없다. XSS가 세션을 그대로 들고 나가는 경로를 닫는다.
        http-only: true
        # 신뢰할 수 없는 origin에는 되돌려주지 않는다. 프로필로 갈라 끄지 않는 이유는 끌 필요가
        # 없기 때문이다 — 개발 compose가 게시하는 `http://127.0.0.1:18080`은 W3C Secure Contexts가
        # 규정한 potentially trustworthy origin(`127.0.0.0/8`·`::1`·`localhost`)이라 스킴이 `http`
        # 여도 브라우저가 `Secure` 쿠키의 설정과 회신을 허용한다. 그래서 개발·CI 스택의 스텁
        # 제공자 왕복도 이 속성 그대로 성립한다. AD-10을 개발 편의로 무르면 그 완화가
        # production까지 남는다.
        #
        # 다만 Spring Session의 `DefaultCookieSerializer`는 `useSecureCookie`를 명시하지 않으면
        # `request.isSecure()`를 따르고 Nginx는 `X-Forwarded-Proto: http`를 넘긴다. 속성이 실제로
        # 붙으려면 이 값을 명시해야 한다.
        secure: true
        # 최상위 내비게이션으로 돌아오는 OIDC 콜백은 Lax에서도 쿠키를 싣는다. None을 쓰면
        # 교차 사이트 POST에도 실려 CSRF 표면이 넓어진다.
        same-site: lax
  error:
    # 아래 네 값이 없으면 오류 응답에 예외 메시지·스택·바인딩 오류가 실린다.
    # 실제 오류 본문은 ApiErrorHandler가 소유하지만, 그 경로를 우회하는 응답이 생겨도
    # 프레임워크 기본값이 내부 정보를 흘리지 않도록 여기서도 함께 잠근다.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      # whitelabel HTML은 예외 종류와 경로를 그대로 보여 준다.
      enabled: false
  shutdown: graceful

spring:
  application:
    name: bokrilog
  lifecycle:
    # graceful shutdown의 기본 유예는 30초다. compose의 기본 `stop_grace_period`는 10초이므로
    # 기본값끼리 두면 SIGKILL이 먼저 도착해 "PID 1이 graceful stop을 받는다"는 Dockerfile의
    # 설명이 실제로는 성립하지 않는다. 이 값을 컨테이너 유예보다 짧게 잡고,
    # `deploy/compose/compose.yaml`이 `stop_grace_period`를 명시해 두 값을 한 쌍으로 묶는다.
    # 지금 이 애플리케이션에는 오래 걸리는 in-flight 요청이 없어 5초면 충분하다.
    timeout-per-shutdown-phase: 5s
  main:
    banner-mode: 'off'
    # 기동 로그의 "Starting ... (/app/app.jar started by ...)" 줄이 컨테이너 내부 경로와
    # 실행 사용자를 남긴다. 이 스토리는 로그에도 내부 경로를 남기지 않는 것이 계약이다.
    log-startup-info: false
  web:
    resources:
      # 백엔드는 정적 파일을 제공하지 않는다. 정적 자원은 Nginx가 루트에서 제공한다.
      # 이 매핑을 켜 두면 알 수 없는 경로가 정적 자원 조회로 흘러 404 처리 경로가 둘로 갈라진다.
      add-mappings: false
  session:
    # 유휴 만료. 마지막 접근으로부터 이만큼 요청이 없으면 Spring Session이 그 세션을 만료로
    # 다루고 다음 접근에서 행을 지운다. 세션 수명의 두 축 중 하나이며 다른 하나는 아래
    # `bokrilog.session.absolute-lifetime`이다.
    #
    # 이 값이 유일한 정의다. `AuthFlowHandlers`는 인증 전 흐름 세션의 수명을 5분으로 낮추고
    # 로그인 성공 시 이 값으로 되돌리는데, 그 되돌림은 저장소가 만든 새 세션의 기본값을 읽어
    # 수행하므로 숫자가 코드에 다시 적히지 않는다.
    timeout: 30m
    jdbc:
      # 세션 테이블은 `V2__spring_session.sql`이 만든다. 기동 시점에 스키마를 만드는 경로를 열어
      # 두면 스키마를 바꾸는 프로세스가 둘이 되어 AD-12가 깨진다.
      initialize-schema: never
  datasource:
    url: ${BOKRILOG_DB_URL:}
    username: ${BOKRILOG_DB_USERNAME:}
    # 운영 DB 비밀번호(Story 3.8). 값은 저장소 밖의 운영 env 파일(권한 600)만 준다(`deploy/production/`). 개발·CI는 trust라
    # 비어 있다. 값이 있으면 로그 비밀 감지의 대상이다(`ConfiguredSecrets`).
    password: ${BOKRILOG_DB_PASSWORD:}
    hikari:
      # 연결 풀 meter의 `pool` tag 값이다(Story 3.7). 기본값 `HikariPool-1`은 번호가 붙어 닫힌 값이 아니다.
      # `TelemetryAllowlist.POOL_NAME`과 같은 값이어야 DB 연결 메트릭이 출력에 남는다.
      pool-name: bokrilog
  flyway:
    # 기본값과 같은 값이지만 적어 둔다. 마이그레이션 위치와 "지우지 않는다"는 두 가지는
    # 조용히 바뀌면 안 되는 값이다.
    locations: classpath:db/migration
    # `clean`은 스키마를 통째로 지운다. 어떤 프로필에서도 열지 않는다.
    clean-disabled: true
    # 이미 데이터가 있는 스키마를 baseline으로 삼고 넘어가지 않는다. 기대와 다르면 멈춘다.
    baseline-on-migrate: false

# 인증 설정. 값은 환경이 주고 이 파일은 이름만 정한다.
#
# redirect URI를 요청에서 유도하지 않는다. Nginx가 `Host $host`를 넘겨 포트를 잃으므로
# (`deploy/nginx/bokrilog.conf`) 요청에서 조립한 값은 `http://127.0.0.1/...`이 되어 등록값과
# 어긋난다. `$http_host`나 `X-Forwarded-*`로 바꾸는 길은 둘 다 클라이언트가 제어하는 헤더를
# redirect URI 계산에 넣는다. 절대 base URL을 환경에서 받으면 그 입력 경로 자체가 없어진다.
#
# 제공자 엔드포인트(`issuer-uri`·`authorization-uri`·`token-uri`·`jwk-set-uri`)는 여기 없다.
# 어느 제공자에서도 기동 시점에 discovery 왕복을 하지 않으므로 기본값은 코드가 들고 있고, 이
# 이름들은 그것을 덮는 재정의다. 값을 주는 것은 개발·CI의 local OIDC 스텁뿐이다.
#
#   google -- 값이 없으면 Spring Security의 `CommonOAuth2Provider.GOOGLE`이 정한 정본 주소를 쓴다.
#   naver  -- 네이버는 `CommonOAuth2Provider`에 없어 엔드포인트가 필수다. 그래서 `AuthSecurityConfig`가
#             공식 discovery 문서(`https://nid.naver.com/.well-known/openid-configuration`)의 정적
#             주소 네 개를 상수로 들고 있고, 아래 이름은 그 상수를 덮는 자리다. OIDC 경로는
#             `/oauth2/*`이며 레거시 OAuth 2.0 API의 `/oauth2.0/*`과 다르다.
#   kakao  -- 같은 이유로 엔드포인트가 필수이며 값은 공식 discovery 문서
#             (`https://kauth.kakao.com/.well-known/openid-configuration`)의 정적 주소 네 개다.
#             JWKS 경로의 모양이 네이버와 다르다(`/.well-known/jwks.json`). 카카오 콘솔에서
#             OpenID Connect를 켜야 ID Token이 오고, client secret도 콘솔의 선택 기능이라
#             운영자가 켜야 아래 두 값이 모두 채워진다.
bokrilog:
  auth:
    public-base-url: ${BOKRILOG_PUBLIC_BASE_URL:}
    google:
      client-id: ${BOKRILOG_GOOGLE_CLIENT_ID:}
      client-secret: ${BOKRILOG_GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${BOKRILOG_NAVER_CLIENT_ID:}
      client-secret: ${BOKRILOG_NAVER_CLIENT_SECRET:}
    kakao:
      client-id: ${BOKRILOG_KAKAO_CLIENT_ID:}
      client-secret: ${BOKRILOG_KAKAO_CLIENT_SECRET:}
  # 금융 source 연결(Story 2.1). 이름만 이 파일이 정하고 값은 환경이 준다.
  #
  #   BOKRILOG_SOURCE_CREDENTIAL_KEYS  -- `<버전>:<base64 32바이트>`를 쉼표로 이은 key ring.
  #                                       과거 키를 함께 담아 decrypt-only 호환을 유지한다.
  #   BOKRILOG_SOURCE_CREDENTIAL_ACTIVE_KEY_VERSION
  #                                    -- 새 암호화가 쓸 버전. 위 목록에 그 버전이 있어야 한다.
  #   BOKRILOG_BYBIT_BASE_URL          -- 제공자 API의 origin. 개발·CI는 local 스텁을 가리킨다.
  #   BOKRILOG_BYBIT_RESERVED_IP       -- 운영 reserved IP. 키의 `ips`에 이 값이 있어야 통과한다.
  #   BOKRILOG_BYBIT_REQUEST_TIMEOUT   -- 외부 호출 하나의 상한. 넘으면 거절이며 재시도하지 않는다.
  #
  # 값이 없으면 기동이 아니라 **연결 기능**이 fail-closed다(제공자 등록과 같은 관용). key ring이
  # 없으면 평문으로 저장하는 경로를 만들지 않고 거절하며, base URL이나 reserved IP가 없으면 검증
  # 자체가 성립하지 않는다. 어느 값이 비었는지는 응답에도 로그에도 남기지 않는다.
  #
  # 키 자체는 여기에도 compose에도 없다. 자격정보 모양 리터럴을 커밋하지 않는다는 규율이 그대로
  # 적용되며, 개발·CI의 키는 `deploy/compose/verify-same-origin.sh`가 실행 시점에 만들고 백엔드
  # 시험은 시험 JVM이 만든다. production 비밀 공급은 Story 3.8이 소유한다.
  source:
    credential:
      keys: ${BOKRILOG_SOURCE_CREDENTIAL_KEYS:}
      active-key-version: ${BOKRILOG_SOURCE_CREDENTIAL_ACTIVE_KEY_VERSION:}
    bybit:
      base-url: ${BOKRILOG_BYBIT_BASE_URL:}
      reserved-ip: ${BOKRILOG_BYBIT_RESERVED_IP:}
      # 빈 문자열은 Duration으로 읽히지 않는다. 값을 주지 않는 스택의 바닥을 여기서 정한다.
      request-timeout: ${BOKRILOG_BYBIT_REQUEST_TIMEOUT:5s}
      # 호출 예산(ERD-1.0.0 §2.5, Story 2.12). 값은 ERD 그대로이고 백엔드 시험만 줄인다
      # (`BybitStubConfiguration`). 읽을 수 없는 값은 기동을 죽이지 않고 이 기본값으로 접힌다.
      #   auth-per-second            -- 서명 호출의 자격정보(UID)당 초당 요청 수
      #   public-per-second          -- 공개 Market 호출의 서비스 전체 초당 요청 수
      #   max-concurrent-collections -- 동시에 수집하는 연결 수
      #   retry-delays / retry-jitter -- 수집 페이지(거래 기록·지갑)의 timeout·429·10006·5xx 재시도 간격과
      #                                 그 위에 더하는 최대 비율. 최대 3회이며 admission 호출은 재시도하지 않는다
      #   circuit-open               -- HTTP 403(IP 차단) 뒤 모든 Bybit 호출을 멈추는 시간
      #   low-remaining-ratio / low-remaining-wait-cap
      #                              -- `X-Bapi-Limit-Status`가 한도의 이 비율 이하면 다음 페이지를 reset 시각까지
      #                                 늦추되 이 상한을 넘기지 않는다
      budget:
        auth-per-second: ${BOKRILOG_BYBIT_AUTH_PER_SECOND:5}
        public-per-second: ${BOKRILOG_BYBIT_PUBLIC_PER_SECOND:10}
        max-concurrent-collections: ${BOKRILOG_BYBIT_MAX_CONCURRENT_COLLECTIONS:2}
        retry-delays: ${BOKRILOG_BYBIT_RETRY_DELAYS:2s,10s,30s}
        retry-jitter: ${BOKRILOG_BYBIT_RETRY_JITTER:0.2}
        circuit-open: ${BOKRILOG_BYBIT_CIRCUIT_OPEN:10m}
        low-remaining-ratio: ${BOKRILOG_BYBIT_LOW_REMAINING_RATIO:0.2}
        low-remaining-wait-cap: ${BOKRILOG_BYBIT_LOW_REMAINING_WAIT_CAP:5s}
  # 보호된 운영자 표면(Story 3.1). 이름만 이 파일이 정하고 값은 환경이 준다.
  #
  #   BOKRILOG_OPERATORS           -- 운영자 allowlist. `issuer|subject|permissions;…`이고 permissions는
  #                                   `command`·`audit`을 쉼표로 잇는다. 비면 운영자가 없고 모든 운영 요청이
  #                                   404다(fail-closed). 형식이 틀리면 기동을 거부한다. 사용자 UI로 승격하는
  #                                   경로는 없다 — 부여·회수는 이 값의 재배포다.
  #   BOKRILOG_AUDIT_DIGEST_KEY    -- 감사 행 수행자 digest(HMAC-SHA256)의 키. base64 32바이트 이상이고, 비거나
  #                                   짧으면 API 프로세스가 기동을 거부한다(migrate 역할은 받지 않는다).
  #   BOKRILOG_SUPPORT_CONTACT     -- 서비스 공지(Story 3.5)의 지원 연락처 이메일. 비면 공지 발행이 거절되고 사용자
  #                                   공지에 연락처가 없다(허위 지원 경로를 만들지 않는다). 이메일 모양이 아니면
  #                                   기동을 거부한다.
  #
  # 키는 여기에도 compose에도 없다. 개발·CI의 값은 `deploy/compose/verify-same-origin.sh`가 실행 시점에 만들고
  # 백엔드 시험은 시험 JVM이 만든다. production 비밀 공급은 Story 3.8이 소유한다.
  operations:
    operators: ${BOKRILOG_OPERATORS:}
    audit-digest-key: ${BOKRILOG_AUDIT_DIGEST_KEY:}
    support-contact: ${BOKRILOG_SUPPORT_CONTACT:}
  # 광고 참여(Story 4.2·4.3). 이름만 이 파일이 정하고 값은 환경이 준다.
  #
  #   BOKRILOG_AD_PROVIDER_ENABLED -- 광고 공급자 플래그. 기본 false이고 거짓이면 광고 자격 판정과 transition 소비가
  #                                   `PROVIDER_DISABLED`로 건너뛴다(결과 접근은 그대로다). 실제 광고 계정·ad unit·개인정보·접근성
  #                                   승인(외부 출시 게이트) 전에는 켜지 않는다.
  #   BOKRILOG_AD_UNIT_PATH        -- GPT web interstitial의 ad unit 경로(`/<network code>/<unit>…`, Story 4.3). 기본 빈 값이다.
  #                                   공급자는 플래그가 켜졌고 이 값이 형식에 맞을 때만 활성이다 — 비었거나 틀리면 기동은 그대로이고
  #                                   공급자만 꺼진다.
  engagement:
    ad-provider-enabled: ${BOKRILOG_AD_PROVIDER_ENABLED:false}
    ad-unit-path: ${BOKRILOG_AD_UNIT_PATH:}
  # 계정 삭제 tombstone의 사용자 digest(HMAC-SHA256) 키(Story 3.10). base64 32바이트 이상이고 **감사 digest 키와 달라야 한다**(같으면
  # 기동 거부). 삭제 표본·내보내기·복원 적용 역할에서는 필수다 — 비면 그 역할이 뜨지 않는다. Worker·`all`은 값이 있을 때만 받는다 — 키가
  # 있으면 사용자 계정 삭제 실행(Story 5.2, `AccountErasureWorker`)이 첫 단계에서 tombstone을 기록하고(Story 5.3), 키가 없거나
  # `BOKRILOG_ENV=production`(G-5 승인 전)이면 Worker가 삭제를 집지 않는다(요청은 진행 중으로 남는다). API(`BOKRILOG_ROLE=api`)는 값이
  # 있어도 쓰지 않는다(운영 구성은 API 슬롯에 주지 않는다). 받은 프로세스는 이 값을 로그 비밀 노출 감지 대상에 넣는다.
  # 키를 잃으면 외부 tombstone을 복원된 계정과 맞출 수 없으므로 운영 비밀 파일과 OCI 밖 복구 manifest(참조)에 둔다.
  #   BOKRILOG_TOMBSTONE_DIGEST_KEY
  tombstone:
    digest-key: ${BOKRILOG_TOMBSTONE_DIGEST_KEY:}
  # 삭제된 계정이 든 백업의 파기 판정 주기(Story 5.3, `BackupDestructionJudge` — Worker·`all`). 기본 5분이다. 운영 값은 바꾸지 않고
  # 리허설만 짧게 준다(`compose.rehearsal.yaml`).
  backup-destruction:
    judge:
      period: ${BOKRILOG_BACKUP_DESTRUCTION_JUDGE_PERIOD:PT5M}
  telemetry:
    env: ${BOKRILOG_ENV:development}
  # 워커 dispatch 간격. `FirstSnapshotWorker`의 여섯 dispatch(첫 스냅샷·수집·판정·환산·발행·증분 동기화)가
  # 한 번 claim한 뒤 다음 claim까지 쉬는 시간이며, 이 값이 유일한 기본값이다(애너테이션에 기본값을 두지 않는다).
  # 운영은 1초다. 설정으로 연 이유는 시험 하나뿐이다 — 실제 파이프라인을 모는 시험이 단계마다 최대 한 tick을
  # 기다리므로 `AuthFlowTestBase`가 100ms로 줄인다. 이 파일이 값을 환경 변수로 받지는 않지만, 아래 세션 절대
  # 수명과 같은 relaxed binding 경로로 환경 변수가 이 값을 덮을 수 있고, 0 이하의 값이면 워커가 기동을 거부한다.
  # heartbeat 5초는 설정으로 열지 않는다. 줄이면 늦은 워커가 DB fence까지 가지 못하고 메모리 guard에서 끝나
  # fence 시험의 검증력이 준다. lease 30초도 그대로다.
  #
  # drain-timeout(Story 3.8)은 Worker 역할이 종료 신호를 받은 뒤 진행 중 작업을 기다리는 상한이다(`WorkerDrain`). 넘기면 종료 코드
  # 75와 `worker.drain.incomplete`로 끝나고 남은 작업은 lease 만료 뒤 다음 Worker가 잡는다. 운영 compose의 Worker
  # `stop_grace_period`(150초)가 이 값보다 길어야 SIGKILL이 drain을 자르지 않는다.
  sync:
    worker:
      dispatch-interval: 1s
      drain-timeout: 120s
  # 프로세스 역할(Story 3.8, `BokrilogRole`). `api`·`worker`·`all`이고 기본 `all`(지금까지의 동작 — 개발·CI·시험). 운영
  # (`BOKRILOG_ENV=production`)은 `all`을 거부하고 API와 Worker를 따로 띄운다(`deploy/production/compose.yaml`).
  role: ${BOKRILOG_ROLE:all}
  # 세션 수명의 두 번째 축(Story 1.5).
  #
  # 절대 수명이다. 세션 `CREATION_TIME`을 기준으로 세고 재요청·세션 ID 회전으로 늘어나지 않는다.
  # 위 `spring.session.timeout`이 "쓰지 않으면 끊는다"를 담당하고 이 값이 "계속 써도 끊는다"를
  # 담당한다. 유휴 만료만 있으면 탈취된 쿠키가 주기적인 요청만으로 무한히 유지된다.
  #
  # Spring Session에는 대응 개념이 없어 이 애플리케이션이 소유한다. 판정은 `SessionGuard`가 하고
  # 그 클래스의 기본값은 이 값이 없는 구성에서 상한이 사라지지 않게 하는 fail-closed 바닥이다.
  # 두 값이 갈라지면 `AuthSessionExpiryTest`가 먼저 드러낸다.
  #
  # 이 파일이 값을 환경 변수로 받지는 않지만, 그것으로 환경이 이 값을 못 바꾸는 것은 아니다.
  # Boot의 relaxed binding은 어떤 `@ConfigurationProperties` 키에도 대응 환경 변수를 받으므로
  # `BOKRILOG_SESSION_ABSOLUTELIFETIME` 하나로 이 값이 덮인다. 그래서 배선으로 막는 대신 방향을
  # 좁혔다 — `SessionGuard.SessionProperties`가 12시간을 바닥이자 천장으로 clamp하므로 설정은 상한을
  # 줄일 수만 있고, 늘리는 값은 조용히 12시간으로 접힌다. 이 값은 배치가 아니라 보안 정책이고,
  # 환경이 조용히 늘릴 수 있게 두면 그 완화가 어디서 일어났는지 추적할 자리가 없기 때문이다.
  session:
    absolute-lifetime: 12h

# 관측 계측(Story 3.7). 이름만 이 파일이 정하고 값은 환경이 준다.
#
#   BOKRILOG_MANAGEMENT_PORT    -- Actuator 관리 포트. 기본 18081.
#   BOKRILOG_MANAGEMENT_ADDRESS -- 관리 포트가 듣는 주소. 기본 `127.0.0.1` — 같은 네트워크 이름공간(같은 컨테이너·같은
#                                  호스트 프로세스)에서만 닿는다. compose는 포트를 게시하지 않고 Nginx는 `/api`만 넘긴다.
#                                  수집기(Grafana Alloy, Story 3.8)가 다른 이름공간에 있으면 그 배포가 이 값을 정한다.
#   BOKRILOG_ENV             -- 모든 메트릭의 공통 tag `env`. `development`(기본)·`ci`·`production` 중 하나이고, 밖이면
#                               기동을 거부한다. 개발·CI 수치가 운영 실적과 섞이지 않게 한다.
#
# 노출 엔드포인트는 `prometheus` 하나다. `health`·`info`·`env`·`beans` 등은 모두 꺼져 있다(`access.default: none`).
# 외부 liveness는 공개 표면의 `GET /api/status`가 계속 맡는다 — 의존 상태를 숨긴 `UP` 하나가 그 계약이다
# (`StatusController`). 메트릭 이름·tag는 `TelemetryAllowlist`의 닫힌 표만 통과한다(`TelemetryConfig`).
management:
  server:
    port: ${BOKRILOG_MANAGEMENT_PORT:18081}
    address: ${BOKRILOG_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: prometheus
      # `/actuator` 목록 페이지도 닫는다. 열어 두면 관리 포트가 엔드포인트 목록을 답한다.
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    prometheus:
      access: read-only

logging:
  level:
    root: info
    # Spring Security의 인증 실패 로그는 예외와 함께 온다. 그 예외 메시지에는 검증에 실패한
    # claim 값과 제공자 오류 문구가 실릴 수 있다. 실패 원인을 로그에 남기지 않는 것이 이
    # 스토리의 계약이라 error까지만 남긴다.
    org.springframework.security: error
    # 프레임워크의 요청 처리 로그는 warn까지만 남긴다. info·debug에는 핸들러 매핑과 요청 속성이
    # 함께 실려 내부 구조가 드러난다. 여기 남는 warn은 `No mapping for GET /nope`처럼 클라이언트가
    # 보낸 경로뿐이며 내부 경로·스택은 포함하지 않는다.
    # 처리하지 못한 예외는 ApiErrorHandler가 correlation ID만 붙여 직접 기록한다.
    org.springframework.web: warn

---
# 개발용 OIDC 스텁 프로필(Story 1.4).
#
# 이 프로필에서만 `/api/dev-oidc/<제공자>/**`에 local OIDC 제공자가 존재하고 제공자 등록이 그
# 스텁을 가리킨다(`DevOidcStubConfig`). 제공자마다 스텁 인스턴스가 하나이며 issuer·client·서명 키가
# 서로 다르다. 실제 제공자 등록(Google·네이버·카카오 어느 쪽이든)이 함께 구성돼 있으면 기동을 거부하므로
# 스텁과 실제 제공자가 한 프로세스에서 섞이지 않는다. 기본 프로필에는 이 스텁의 빈이 하나도 없고
# 경로도 노출되지 않는다(`DevOidcStubProfileTest`).
#
# 스텁의 client id·secret은 여기 없다. 실행 시점에 만들어지므로 자격정보 모양 리터럴이
# 설정 파일에도 compose에도 남지 않는다.
spring:
  config:
    activate:
      on-profile: dev-oidc
bokrilog:
  auth:
    dev-oidc:
      # 백엔드가 자기 스텁에 닿는 base URL. 브라우저가 보는 `public-base-url`과 다른 값이다 —
      # 인가 요청은 브라우저가 공개 origin으로 보내지만 code 교환과 JWKS 조회는 백엔드가
      # 보내고, 공개 origin은 compose 네트워크 안에서 해석되지 않는다.
      #
      # 값이 비면 자기 서블릿 포트(`server.port`)로 조립한다. 이름만 이 파일이 정한다.
      internal-base-url: ${BOKRILOG_DEV_OIDC_INTERNAL_BASE_URL:}

---
# 일회성 migration 역할(AD-12).
#
# 같은 이미지의 별도 프로세스다. 이 프로필에서만 Flyway가 실제로 스키마를 바꾸며
# (`SchemaValidationConfig`), 웹 서버를 띄우지 않으므로 마이그레이션이 끝나면 프로세스가 종료된다.
# 종료 코드가 곧 마이그레이션의 성공 여부다.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none

---
# 일회성 배포 감사 역할(Story 3.8 AC-5).
#
# 배포 스크립트(`deploy/production/deploy.sh`)가 단계마다 같은 이미지로 한 번 띄워 감사 원장 `operations_audit_event`에 SYSTEM 행
# 하나를 추가하고 끝난다(`DeployAuditRunner`). 웹 서버를 띄우지 않고 **Flyway 검사도 하지 않는다** — 첫 행(`GATE`)은 migration
# 전에 새 이미지로 쓰므로 validate가 미적용 migration 때문에 반드시 실패한다. 이 역할은 V17 표에 INSERT만 하므로 schema 차이와
# 무관하다. 감사 digest 키(`BOKRILOG_AUDIT_DIGEST_KEY`)는 API와 같은 값이 필요하다(수행자 digest가 같은 키로 묶인다).
#
# 입력은 환경이 준다. 이름만 여기 있다.
#   BOKRILOG_DEPLOY_OPERATION -- 배포 하나의 operation ID(배포마다 하나)
#   BOKRILOG_DEPLOY_STEP      -- 단계명(GATE·DRAINED·MIGRATED·INACTIVE_VERIFIED·CUTOVER·VERIFIED·ROLLED_BACK)
#   BOKRILOG_DEPLOY_OUTCOME   -- 감사 결과(REQUESTED·COMPLETED·FAILED)
#   BOKRILOG_DEPLOY_TARGET    -- 배포 대상 image digest 참조
#   BOKRILOG_DEPLOY_ACTOR     -- 배포 수행자 이름. 원장에는 `deployer:` keyed digest로만 남는다
#   BOKRILOG_DEPLOY_CODE      -- 선택. 실패 사유 code
#   BOKRILOG_DEPLOY_SLOT      -- 선택. 그 단계의 슬롯(blue·green)
#   BOKRILOG_DEPLOY_PREVIOUS  -- 선택. 이전 image digest 참조
#   BOKRILOG_DEPLOY_REHEARSAL -- 리허설이면 true(감사 details에 `rehearsal:true`)
spring:
  config:
    activate:
      on-profile: deploy-audit
  main:
    web-application-type: none
  flyway:
    enabled: false
bokrilog:
  deploy:
    audit:
      operation: ${BOKRILOG_DEPLOY_OPERATION:}
      step: ${BOKRILOG_DEPLOY_STEP:}
      outcome: ${BOKRILOG_DEPLOY_OUTCOME:}
      target: ${BOKRILOG_DEPLOY_TARGET:}
      actor: ${BOKRILOG_DEPLOY_ACTOR:}
      code: ${BOKRILOG_DEPLOY_CODE:}
      slot: ${BOKRILOG_DEPLOY_SLOT:}
      previous: ${BOKRILOG_DEPLOY_PREVIOUS:}
      rehearsal: ${BOKRILOG_DEPLOY_REHEARSAL:false}

---
# 일회성 백업 기록 역할(Story 3.9).
#
# 운영 호스트의 백업 절차(`deploy/production/backup.sh`)가 실행마다 같은 이미지로 띄워 `operations_backup_event`에 행을 추가하고
# 끝난다(`BackupRecordRunner`) — 시작에 한 번, 끝에 한 번(결과·파기·측정). 파기 실패·기한 초과는 감사 원장에도 SYSTEM 행을 남긴다.
# 웹 서버를 띄우지 않고 **Flyway 검사도 하지 않는다**(배포 감사 역할과 같은 이유 — V24 표와 V17 원장에 INSERT만 한다). 감사 digest
# 키(`BOKRILOG_AUDIT_DIGEST_KEY`)는 API와 같은 값이 필요하다.
#
# **backup key(age identity)와 저장소 설정은 이 역할에 오지 않는다.** 그 둘은 운영 호스트의 `/etc/bokrilog/backup/`(권한 600)에만
# 있고 호스트 도구(age·rclone)만 읽는다 — 앱 프로세스·compose 환경·DB 어디에도 넣지 않는다(앱 key ring과 분리).
#
# 입력은 환경이 준다. 이름만 여기 있다.
#   BOKRILOG_BACKUP_OPERATION -- 실행 하나의 operation ID
#   BOKRILOG_BACKUP_ACTOR     -- 백업 수행자 이름. 감사 원장에는 `backup:` keyed digest로만 남는다
#   BOKRILOG_BACKUP_EVENTS    -- 기록할 행들(`;`로 행, `,`로 칸: event,generation,store,code,bytes,count,quota,sha256,key_id)
#   BOKRILOG_BACKUP_REHEARSAL -- 리허설이면 true(감사 details에 `rehearsal:true`)
spring:
  config:
    activate:
      on-profile: backup-record
  main:
    web-application-type: none
  flyway:
    enabled: false
bokrilog:
  backup:
    record:
      operation: ${BOKRILOG_BACKUP_OPERATION:}
      actor: ${BOKRILOG_BACKUP_ACTOR:}
      events: ${BOKRILOG_BACKUP_EVENTS:}
      rehearsal: ${BOKRILOG_BACKUP_REHEARSAL:false}

---
# 검증용 일회성 삭제 표본 역할(Story 3.10).
#
# 복원 리허설·훈련이 표본 계정 하나를 지운다(`DeletionSampleRunner` → `AccountErasure`) — 삭제 전환·tombstone outbox 행·모듈 삭제·payload
# 삭제가 한 트랜잭션이다. **사용자 삭제 경로가 아니다**(Epic 5). 운영 환경(`BOKRILOG_ENV=production`)에서는 기동을 거부한다. 웹 서버를
# 띄우지 않고 Flyway는 검증만 한다(여러 모듈의 표에 쓰므로 schema가 맞아야 한다). 감사 digest 키(제한 target 비식별)와 tombstone digest
# 키가 필요하다.
#   BOKRILOG_DELETION_SAMPLE_USER    -- 지울 표본 계정의 내부 user_id
#   BOKRILOG_DELETION_SAMPLE_REQUEST -- 삭제 요청 ID(`[A-Za-z0-9_-]{1,64}`)
#   BOKRILOG_DELETION_SAMPLE_REHEARSAL -- 리허설 표지(true). 없으면 기동을 거부한다(운영 환경 값만으로는 막지 않는다)
spring:
  config:
    activate:
      on-profile: deletion-sample
  main:
    web-application-type: none
bokrilog:
  deletion:
    sample:
      user: ${BOKRILOG_DELETION_SAMPLE_USER:}
      request: ${BOKRILOG_DELETION_SAMPLE_REQUEST:}
      rehearsal: ${BOKRILOG_DELETION_SAMPLE_REHEARSAL:false}

---
# 일회성 tombstone 내보내기 역할(Story 3.10).
#
# 운영 호스트의 timer(`deploy/production/tombstone-export.sh`, 15분 주기)가 띄운다. 백업 파기가 완료됐고 그 상태로 성공한 내보내기에
# 이미 실렸고 보존 기한이 지난 outbox 행만 지우고(Story 5.3 — 완료가 아닌 행은 기한과 무관하게 남는다) 실을 행 전체를 마운트된 파일
# 하나에 쓴다(`TombstoneExportRunner`). 호스트가 그 파일을 tombstone 전용 age key로 암호화해 OCI 밖 저장소에 올린다
# — **그 age key는 이 역할에 오지 않는다.** 웹 서버를 띄우지 않고 Flyway는 검증만 한다. 파일 머리에 digest 키 ID를 싣기 위해
# tombstone digest 키가, 만료 삭제·내보내기 성공의 감사 SYSTEM 행(Story 5.3)을 쓰기 위해 감사 digest 키가 필요하다.
#   BOKRILOG_TOMBSTONE_EXPORT_CONFIRM -- 기록 모드(Story 5.3). 비어 있지 않으면 파일을 쓰지 않고 그 내보내기를 "사본을 올리고 대조했다"는
#                                        성공(값 = 실린 tombstone 수)으로 채운다. 호스트가 업로드·대조·`latest` 갱신 뒤에만 준다.
#   BOKRILOG_TOMBSTONE_EXPORT_ID      -- 기록 모드의 내보내기 번호. 내보내기 모드가 사본 옆 `<파일>.export-id`에 쓴 값이다.
spring:
  config:
    activate:
      on-profile: tombstone-export
  main:
    web-application-type: none
bokrilog:
  tombstone:
    export:
      file: ${BOKRILOG_TOMBSTONE_EXPORT_FILE:/run/bokrilog/io/tombstones.txt}
      confirm: ${BOKRILOG_TOMBSTONE_EXPORT_CONFIRM:}
      id: ${BOKRILOG_TOMBSTONE_EXPORT_ID:}

---
# 일회성 복원 적용 역할(Story 3.10).
#
# 복원 절차(`deploy/production/restore.sh`)가 격리 compose 프로젝트에서 `pg_restore`·migration 뒤, API·Worker를 띄우기 **전에** 한 번
# 띄운다(`RestoreApplyRunner` → `RestoreApplication`). 마운트된 파일 하나가 복호화된 외부 tombstone이다 — 맞은 계정을 다시 지우고, 모든
# 세션을 폐기하고, 불변식과 자격정보 표본 복호를 센다. 통과해야 종료 0이다. 웹 서버를 띄우지 않고 **Flyway는 검증한다**(migration이 먼저
# 돌았다). 감사 digest 키·tombstone digest 키·자격정보 key ring이 필요하고, 로그인 제공자·Bybit 값은 받지 않는다(외부 호출 0).
spring:
  config:
    activate:
      on-profile: restore-apply
  main:
    web-application-type: none
bokrilog:
  restore:
    tombstones-file: ${BOKRILOG_RESTORE_TOMBSTONES_FILE:/run/bokrilog/io/tombstones.txt}
    # 격리 표지. restore.sh가 격리 프로젝트 이름(`bokrilog-restore-*`)을 준다 — 없으면 적용하지 않는다.
    isolated-project: ${BOKRILOG_RESTORE_ISOLATED_PROJECT:}
