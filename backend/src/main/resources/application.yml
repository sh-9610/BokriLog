# BokriLog 백엔드 설정.
#
# 자격정보·비밀·연결 문자열을 두지 않는다. 이 파일은 저장소에 그대로 커밋되며 모든 PR에서
# gitleaks가 검사한다. 자격정보 모양의 리터럴은 값이 가짜여도 넣지 않는다. 탐지가 나면
# 규칙을 완화하는 대신 그 리터럴을 없앤다.
#
# 데이터베이스·세션 저장소 설정이 없는 것은 미완성이 아니라 이 스토리의 계약이다.
# PostgreSQL과 Spring Session JDBC는 Story 1.3이 도입한다.

server:
  # 컨테이너 안의 포트다. 바깥에 열리는 포트는 Nginx 하나뿐이며 `deploy/compose/compose.yaml`이 정한다.
  port: 8080
  error:
    # 아래 네 값이 없으면 오류 응답에 예외 메시지·스택·바인딩 오류가 실린다.
    # 실제 오류 본문은 ApiErrorHandler가 소유하지만, 그 경로를 우회하는 응답이 생겨도
    # 프레임워크 기본값이 내부 정보를 흘리지 않도록 여기서도 함께 잠근다.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      # whitelabel HTML은 예외 종류와 경로를 그대로 보여 준다.
      enabled: false
  shutdown: graceful

spring:
  application:
    name: bokrilog
  lifecycle:
    # graceful shutdown의 기본 유예는 30초다. compose의 기본 `stop_grace_period`는 10초이므로
    # 기본값끼리 두면 SIGKILL이 먼저 도착해 "PID 1이 graceful stop을 받는다"는 Dockerfile의
    # 설명이 실제로는 성립하지 않는다. 이 값을 컨테이너 유예보다 짧게 잡고,
    # `deploy/compose/compose.yaml`이 `stop_grace_period`를 명시해 두 값을 한 쌍으로 묶는다.
    # 지금 이 애플리케이션에는 오래 걸리는 in-flight 요청이 없어 5초면 충분하다.
    timeout-per-shutdown-phase: 5s
  main:
    banner-mode: 'off'
    # 기동 로그의 "Starting ... (/app/app.jar started by ...)" 줄이 컨테이너 내부 경로와
    # 실행 사용자를 남긴다. 이 스토리는 로그에도 내부 경로를 남기지 않는 것이 계약이다.
    log-startup-info: false
  web:
    resources:
      # 백엔드는 정적 파일을 제공하지 않는다. 정적 자원은 Nginx가 루트에서 제공한다.
      # 이 매핑을 켜 두면 알 수 없는 경로가 정적 자원 조회로 흘러 404 처리 경로가 둘로 갈라진다.
      add-mappings: false

logging:
  level:
    root: info
    # 프레임워크의 요청 처리 로그는 warn까지만 남긴다. info·debug에는 핸들러 매핑과 요청 속성이
    # 함께 실려 내부 구조가 드러난다. 여기 남는 warn은 `No mapping for GET /nope`처럼 클라이언트가
    # 보낸 경로뿐이며 내부 경로·스택은 포함하지 않는다.
    # 처리하지 못한 예외는 ApiErrorHandler가 correlation ID만 붙여 직접 기록한다.
    org.springframework.web: warn
